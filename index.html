<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nizam Soft Ön Muhasebe</title>
<style>
/* ============================================================
   Nizam Soft Ön Muhasebe - Tek Dosya Uygulama
   Kurumsal Renkler: Kırmızı / Siyah / Antrasit / Beyaz / Açık Gri
   ============================================================ */

:root{
  --kirmizi:#d32027;
  --kirmizi-koyu:#a5161c;
  --siyah:#111418;
  --antrasit:#1f2530;
  --antrasit-acik:#2b3340;
  --beyaz:#ffffff;
  --gri:#f2f4f7;
  --gri-orta:#e2e6ec;
  --gri-koyu:#c3cad4;
  --metin:#1f2530;
  --metin-soluk:#5b6472;
  --yesil:#1f9d55;
  --sari:#d9a406;
  --golge:0 2px 10px rgba(0,0,0,.08);
  --golge-buyuk:0 12px 40px rgba(0,0,0,.22);
  --radius:12px;
  --menu-genislik:250px;
  --ana-bg:#eef1f5;
  --kart-bg:#ffffff;
  --kenar:#e2e6ec;
}
/* Koyu tema */
body.tema-koyu{
  --ana-bg:#161a20;
  --kart-bg:#1f2530;
  --metin:#e8ebf0;
  --metin-soluk:#9aa4b2;
  --gri:#242b36;
  --gri-orta:#2e3744;
  --gri-koyu:#3a4552;
  --kenar:#2e3744;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji",sans-serif;
  background:var(--ana-bg);
  color:var(--metin);
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ---------------- Yerleşim ---------------- */
.uygulama{display:flex;height:100vh;width:100%}

/* Sol Menü */
.yan-menu{
  width:var(--menu-genislik);
  background:linear-gradient(180deg,var(--siyah),var(--antrasit));
  color:#fff;
  display:flex;flex-direction:column;
  flex-shrink:0;
  transition:width .28s cubic-bezier(.4,0,.2,1);
  z-index:40;
}
.marka{
  padding:22px 18px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.marka-logo{
  width:44px;height:44px;border-radius:10px;
  background:var(--kirmizi);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:20px;color:#fff;flex-shrink:0;
  overflow:hidden;
}
.marka-logo img{width:100%;height:100%;object-fit:cover}
.marka-yazi{line-height:1.2;overflow:hidden;white-space:nowrap}
.marka-yazi b{font-size:16px;font-weight:700;display:block}
.marka-yazi span{font-size:11px;color:var(--gri-koyu);letter-spacing:.5px}

.menu-liste{list-style:none;padding:12px 10px;flex:1;overflow-y:auto}
.menu-oge{
  display:flex;align-items:center;gap:14px;
  padding:13px 14px;margin:3px 0;
  border-radius:10px;cursor:pointer;
  color:#d4d9e0;font-weight:500;
  position:relative;overflow:hidden;
  transition:background .2s,color .2s,transform .15s;
  white-space:nowrap;
}
.menu-oge .ikon{width:22px;text-align:center;font-size:18px;flex-shrink:0}
.menu-oge:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(2px)}
.menu-oge.aktif{background:var(--kirmizi);color:#fff;box-shadow:0 6px 16px rgba(211,32,39,.4)}
.menu-oge.aktif::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#fff;
}
.menu-alt{
  padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;color:var(--gri-koyu);text-align:center;
}

/* Ana içerik */
.icerik{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
.ust-bar{
  height:66px;flex-shrink:0;
  background:var(--kart-bg);
  border-bottom:1px solid var(--kenar);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;box-shadow:var(--golge);z-index:20;
}
.ust-bar .sol{display:flex;align-items:center;gap:16px}
.menu-buton{
  background:none;border:none;cursor:pointer;font-size:22px;color:var(--metin);
  width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;
}
.menu-buton:hover{background:var(--gri)}
.sayfa-baslik{font-size:20px;font-weight:700}
.ust-bar .sag{display:flex;align-items:center;gap:14px;color:var(--metin-soluk);font-size:13px}
.ust-firma{font-weight:600;color:var(--metin)}

.sayfa-alan{flex:1;overflow-y:auto;padding:24px}
.sayfa{animation:girisSol .35s ease}
@keyframes girisSol{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Menü kapalı durum */
body.menu-kapali .yan-menu{width:74px}
body.menu-kapali .marka-yazi,
body.menu-kapali .menu-oge span.etiket,
body.menu-kapali .menu-alt{display:none}
body.menu-kapali .menu-oge{justify-content:center}

/* ---------------- Genel bileşenler ---------------- */
.kart{
  background:var(--kart-bg);border:1px solid var(--kenar);
  border-radius:var(--radius);padding:20px;box-shadow:var(--golge);
}
h2.bolum-baslik{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
h2.bolum-baslik::before{content:"";width:5px;height:22px;background:var(--kirmizi);border-radius:3px}

/* Özet kartları */
.ozet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-bottom:24px}
.ozet-kart{
  background:var(--kart-bg);border:1px solid var(--kenar);border-radius:var(--radius);
  padding:20px;box-shadow:var(--golge);position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.ozet-kart:hover{transform:translateY(-3px);box-shadow:var(--golge-buyuk)}
.ozet-kart::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;opacity:.12}
.ozet-kart .ust{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ozet-ikon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.ozet-kart .etiket{font-size:13px;color:var(--metin-soluk);font-weight:600}
.ozet-kart .deger{font-size:24px;font-weight:800;letter-spacing:-.5px}
.i-mavi{background:#2563eb}.i-yesil{background:var(--yesil)}.i-kirmizi{background:var(--kirmizi)}.i-turuncu{background:#e8730c}

/* Tablolar */
.tablo-sar{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--kenar)}
table.veri{width:100%;border-collapse:collapse;background:var(--kart-bg);font-size:14px}
table.veri th{
  background:var(--antrasit);color:#fff;text-align:left;padding:12px 14px;
  font-weight:600;font-size:13px;white-space:nowrap;position:sticky;top:0;
}
table.veri td{padding:11px 14px;border-bottom:1px solid var(--kenar);white-space:nowrap}
table.veri tbody tr{cursor:default;transition:background .15s}
table.veri tbody tr:hover{background:rgba(211,32,39,.06)}
table.veri tbody tr.secili{background:rgba(211,32,39,.14);box-shadow:inset 3px 0 0 var(--kirmizi)}
table.veri tr.ana-hesap-satir{background:var(--gri);font-weight:700}
body.tema-koyu table.veri tr.ana-hesap-satir{background:var(--gri-orta)}
table.veri tr.ana-hesap-satir:hover{background:var(--gri-orta)}
.sag-hiza{text-align:right}
.borc{color:var(--yesil);font-weight:600}
.alacak{color:var(--kirmizi);font-weight:600}
.bos-mesaj{text-align:center;padding:34px;color:var(--metin-soluk);font-style:italic}
.girinti{padding-left:34px !important;color:var(--metin-soluk)}
.kod-rozet{font-family:"Consolas",monospace;font-weight:700;background:var(--gri);padding:2px 8px;border-radius:6px;font-size:13px}

/* Butonlar */
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .18s;font-family:inherit;line-height:1;user-select:none;
}
.btn:active{transform:scale(.97)}
.btn-kirmizi{background:var(--kirmizi);color:#fff}
.btn-kirmizi:hover{background:var(--kirmizi-koyu)}
.btn-koyu{background:var(--antrasit);color:#fff}
.btn-koyu:hover{background:var(--antrasit-acik)}
.btn-gri{background:var(--gri-orta);color:var(--metin)}
.btn-gri:hover{background:var(--gri-koyu)}
.btn-yesil{background:var(--yesil);color:#fff}
.btn-yesil:hover{filter:brightness(.92)}
.btn-cizgi{background:transparent;border:2px solid var(--gri-koyu);color:var(--metin)}
.btn-cizgi:hover{border-color:var(--kirmizi);color:var(--kirmizi)}
.btn-kucuk{padding:7px 12px;font-size:13px;border-radius:8px}
.btn-ikon{padding:8px 10px;font-size:15px}
.buton-grup{display:flex;gap:10px;flex-wrap:wrap}

/* Sekmeler */
.sekmeler{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;background:var(--kart-bg);padding:8px;border-radius:var(--radius);border:1px solid var(--kenar)}
.sekme{
  padding:13px 22px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;
  color:var(--metin-soluk);transition:all .2s;border:none;background:none;font-family:inherit;
}
.sekme:hover{background:var(--gri);color:var(--metin)}
.sekme.aktif{background:var(--kirmizi);color:#fff;box-shadow:0 5px 14px rgba(211,32,39,.35)}

/* Formlar */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.form-alan{display:flex;flex-direction:column;gap:7px}
.form-alan.tam{grid-column:1/-1}
.form-alan label{font-size:13px;font-weight:600;color:var(--metin-soluk)}
.form-alan label .zorunlu{color:var(--kirmizi);margin-left:2px}
.form-alan input,.form-alan select,.form-alan textarea{
  padding:12px 14px;border:2px solid var(--kenar);border-radius:10px;font-size:15px;
  font-family:inherit;background:var(--kart-bg);color:var(--metin);transition:border .18s,box-shadow .18s;width:100%;
}
.form-alan input:focus,.form-alan select:focus,.form-alan textarea:focus{
  outline:none;border-color:var(--kirmizi);box-shadow:0 0 0 3px rgba(211,32,39,.12);
}
.form-alan input[readonly]{background:var(--gri);color:var(--metin-soluk);cursor:not-allowed}
.form-alan textarea{resize:vertical;min-height:70px}
.form-baslik{font-size:16px;font-weight:700;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--gri-orta)}

/* Dosya alanı */
.dosya-kutu{border:2px dashed var(--gri-koyu);border-radius:10px;padding:14px;text-align:center}
.dosya-bilgi{margin-top:10px;font-size:13px;color:var(--metin-soluk)}
.dosya-adi{font-weight:600;color:var(--metin)}

/* Modal */
.modal-katman{
  position:fixed;inset:0;background:rgba(10,14,20,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-katman.acik{display:flex;animation:fadeGiris .2s ease}
@keyframes fadeGiris{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--kart-bg);border-radius:16px;box-shadow:var(--golge-buyuk);
  width:100%;max-width:620px;max-height:90vh;display:flex;flex-direction:column;
  animation:modalGiris .28s cubic-bezier(.34,1.3,.64,1);
}
.modal.genis{max-width:900px}
@keyframes modalGiris{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.modal-ust{padding:20px 24px;border-bottom:1px solid var(--kenar);display:flex;align-items:center;justify-content:space-between}
.modal-ust h3{font-size:18px}
.modal-kapat{background:none;border:none;font-size:26px;cursor:pointer;color:var(--metin-soluk);line-height:1;width:34px;height:34px;border-radius:8px}
.modal-kapat:hover{background:var(--gri);color:var(--kirmizi)}
.modal-govde{padding:24px;overflow-y:auto}
.modal-alt{padding:16px 24px;border-top:1px solid var(--kenar);display:flex;gap:10px;justify-content:flex-end}

/* Bildirim (toast) */
.bildirim-alan{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:12px;max-width:360px}
.bildirim{
  background:var(--kart-bg);border-left:5px solid var(--metin-soluk);border-radius:10px;
  padding:15px 18px;box-shadow:var(--golge-buyuk);display:flex;gap:12px;align-items:flex-start;
  animation:bildirimGiris .3s cubic-bezier(.34,1.3,.64,1);
}
@keyframes bildirimGiris{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
.bildirim.cikis{animation:bildirimCikis .3s ease forwards}
@keyframes bildirimCikis{to{opacity:0;transform:translateX(60px)}}
.bildirim.basari{border-color:var(--yesil)}
.bildirim.hata{border-color:var(--kirmizi)}
.bildirim.uyari{border-color:var(--sari)}
.bildirim .b-ikon{font-size:20px;flex-shrink:0}
.bildirim.basari .b-ikon{color:var(--yesil)}
.bildirim.hata .b-ikon{color:var(--kirmizi)}
.bildirim.uyari .b-ikon{color:var(--sari)}
.bildirim .b-metin{font-size:14px;line-height:1.4}
.bildirim .b-metin b{display:block;margin-bottom:2px}

/* Rozetler / durum */
.rozet{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700}
.rozet.odendi{background:rgba(31,157,85,.15);color:var(--yesil)}
.rozet.kismi{background:rgba(217,164,6,.18);color:var(--sari)}
.rozet.odenmedi{background:rgba(211,32,39,.14);color:var(--kirmizi)}

/* Detay üst bilgi */
.detay-ust{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:20px}
.detay-kutu{background:var(--gri);border-radius:10px;padding:14px 16px}
.detay-kutu .k-etiket{font-size:12px;color:var(--metin-soluk);font-weight:600;margin-bottom:5px}
.detay-kutu .k-deger{font-size:19px;font-weight:800}

/* Araç çubuğu */
.arac-cubuk{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.arama-kutu{position:relative;flex:1;min-width:200px}
.arama-kutu input{width:100%;padding:11px 14px 11px 40px;border:2px solid var(--kenar);border-radius:10px;font-size:14px;background:var(--kart-bg);color:var(--metin)}
.arama-kutu input:focus{outline:none;border-color:var(--kirmizi)}
.arama-kutu::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}

.satir-arasi{margin-top:24px}
.mini-liste-baslik{font-size:14px;font-weight:700;margin:22px 0 12px;color:var(--metin-soluk)}

/* Rapor */
.rapor-secim{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.rapor-kutu{
  background:var(--kart-bg);border:2px solid var(--kenar);border-radius:12px;padding:18px;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;gap:14px;
}
.rapor-kutu:hover{border-color:var(--kirmizi);transform:translateY(-2px);box-shadow:var(--golge)}
.rapor-kutu.aktif{border-color:var(--kirmizi);background:rgba(211,32,39,.05)}
.rapor-kutu .r-ikon{font-size:26px}
.rapor-kutu b{font-size:14px}

/* Yardımcı */
.satir-ic{display:flex;gap:6px}
.aralik{height:1px;background:var(--kenar);margin:20px 0}
.etiket-satir{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--kenar);font-size:14px}
.etiket-satir b{font-weight:700}

/* Nakit Akışı */
.nakit-ozet{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.nakit-ozet .ozet-kart{padding:16px}
.nakit-ozet .deger{font-size:19px}
.nakit-arac{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.nakit-arac select,.nakit-arac input{padding:9px 12px;border:2px solid var(--kenar);border-radius:9px;background:var(--kart-bg);color:var(--metin);font-family:inherit;font-size:13px}
.nakit-tablo-sar{overflow-x:auto;border:1px solid var(--kenar);border-radius:var(--radius);position:relative}
table.nakit{border-collapse:collapse;font-size:13px;white-space:nowrap;min-width:100%}
table.nakit th,table.nakit td{padding:9px 12px;border-bottom:1px solid var(--kenar);text-align:right}
table.nakit thead th{background:var(--antrasit);color:#fff;position:sticky;top:0;z-index:2;font-weight:600}
table.nakit th.sabit,table.nakit td.sabit{position:sticky;left:0;z-index:1;text-align:left;background:var(--kart-bg);font-weight:600;box-shadow:2px 0 4px rgba(0,0,0,.06);min-width:130px}
table.nakit thead th.sabit{z-index:3;background:var(--antrasit)}
table.nakit tr.satir-devir td{color:var(--metin-soluk)}
table.nakit tr.satir-giris td.deger{color:var(--yesil)}
table.nakit tr.satir-cikis td.deger{color:var(--kirmizi)}
table.nakit tr.satir-kalan td{font-weight:700}
table.nakit td.neg{color:#fff;background:var(--kirmizi)}
table.nakit td.dusuk{background:rgba(217,164,6,.22)}
table.nakit td.bugun-sutun{box-shadow:inset 0 0 0 2px var(--kirmizi)}
table.nakit th.bugun-sutun{background:var(--kirmizi)}
.nk-nokta{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.nk-tahmini{border:1px dashed var(--gri-koyu);border-radius:4px;padding:1px 3px}
.nakit-hucre{cursor:default}
.nakit-pop{position:fixed;z-index:300;background:var(--kart-bg);border:1px solid var(--kenar);border-radius:12px;box-shadow:var(--golge-buyuk);padding:14px;max-width:340px;font-size:13px;display:none}
.nakit-pop.acik{display:block;animation:fadeGiris .12s ease}
.nakit-pop h4{font-size:13px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--kenar)}
.nakit-pop .pop-satir{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--kenar)}
.nakit-pop .pop-satir:last-child{border-bottom:none}
.nakit-pop .pop-aciklama{font-size:12px;color:var(--metin-soluk)}
.nakit-pop .pop-toplam{margin-top:8px;padding-top:8px;border-top:2px solid var(--gri-orta);font-weight:700;display:flex;justify-content:space-between}
.nakit-grafik-kutu{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.nakit-grafik-kutu canvas{width:100%;height:220px;background:var(--kart-bg);border:1px solid var(--kenar);border-radius:10px}
@media(max-width:820px){.nakit-grafik-kutu{grid-template-columns:1fr}}
.uyari-serit{background:rgba(211,32,39,.1);border:1px solid var(--kirmizi);color:var(--kirmizi);padding:12px 16px;border-radius:10px;margin-bottom:16px;font-weight:600}

/* Responsive */
@media(max-width:820px){
  body:not(.menu-kapali) .yan-menu{position:fixed;height:100vh;box-shadow:var(--golge-buyuk)}
  body:not(.menu-kapali) .icerik{margin-left:0}
  .sayfa-baslik{font-size:17px}
  .sayfa-alan{padding:16px}
  .ust-firma-metin{display:none}
}

/* Yazdırma */
@media print{
  body{overflow:visible;height:auto}
  .yan-menu,.ust-bar,.no-print,.bildirim-alan{display:none !important}
  .icerik{height:auto;overflow:visible}
  .sayfa-alan{padding:0;overflow:visible}
  .kart{box-shadow:none;border:none}
  .modal-katman{position:static;background:none;display:block !important;padding:0}
  .modal{box-shadow:none;max-width:100%;max-height:none}
  .modal-ust .modal-kapat,.modal-alt{display:none !important}
  table.veri th{background:#333 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #yazdir-alan{display:block !important}
  @page{size:A4;margin:14mm}
}
#yazdir-alan{display:none}
</style>
</head>
<body>
<div class="uygulama">
  <!-- SOL MENÜ -->
  <nav class="yan-menu">
    <div class="marka">
      <div class="marka-logo" id="marka-logo">NS</div>
      <div class="marka-yazi">
        <b>Nizam Soft</b>
        <span>ÖN MUHASEBE</span>
      </div>
    </div>
    <ul class="menu-liste" id="menu-liste">

<script>
"use strict";
/* ==================================================================
   NIZAM SOFT ÖN MUHASEBE
   Bölüm 1: Yardımcı Fonksiyonlar (format, tarih, doğrulama)
   ================================================================== */
const Yardimci = {
  paraFormat(sayi){
    const n = Number(sayi) || 0;
    return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n) + ' TL';
  },
  sayiFormat(sayi){
    const n = Number(sayi) || 0;
    return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
  },
  tarihFormat(iso){
    if(!iso) return '';
    const p = iso.split('-');
    if(p.length!==3) return iso;
    return `${p[2]}.${p[1]}.${p[0]}`;
  },
  bugun(){
    const d = new Date();
    const ay = String(d.getMonth()+1).padStart(2,'0');
    const gun = String(d.getDate()).padStart(2,'0');
    return `${d.getFullYear()}-${ay}-${gun}`;
  },
  dosyaTarih(){
    const d = new Date();
    const ay = String(d.getMonth()+1).padStart(2,'0');
    const gun = String(d.getDate()).padStart(2,'0');
    return `${d.getFullYear()}-${ay}-${gun}`;
  },
  paraCoz(deger){
    // "1.234,56" veya "1234.56" -> number
    if(typeof deger === 'number') return deger;
    if(!deger) return 0;
    let s = String(deger).trim().replace(/\s|TL/gi,'');
    if(s.indexOf(',')>-1){ s = s.replace(/\./g,'').replace(',','.'); }
    const n = parseFloat(s);
    return isNaN(n)?0:n;
  },
  kacisHTML(s){
    if(s===undefined||s===null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  },
  ibanGecerli(iban){
    if(!iban) return true; // opsiyonel
    const t = iban.replace(/\s/g,'').toUpperCase();
    return /^TR\d{24}$/.test(t);
  },
  ibanDuzenle(iban){
    const t = iban.replace(/\s/g,'').toUpperCase();
    return t.replace(/(.{4})/g,'$1 ').trim();
  },
  boyutFormat(bayt){
    if(bayt < 1024) return bayt + ' B';
    if(bayt < 1048576) return (bayt/1024).toFixed(1) + ' KB';
    return (bayt/1048576).toFixed(2) + ' MB';
  },
  yeniId(){
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
  },
  // --- Tarih matematiği (yyyy-mm-dd) ---
  iso(y,m,d){ return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; },
  parcala(iso){ const p=(iso||'').split('-'); return {y:+p[0], m:+p[1], d:+p[2]}; },
  ayinSonGunu(y,m){ return new Date(y, m, 0).getDate(); },
  // Bir tarihe n ay ekle; hedef gün o ayda yoksa ayın son günü kullanılır
  ayEkle(iso, n, hedefGun){
    const p = this.parcala(iso);
    let ay = p.m - 1 + n, y = p.y + Math.floor(ay/12);
    ay = ((ay%12)+12)%12;
    const gun = hedefGun || p.d;
    const sonGun = this.ayinSonGunu(y, ay+1);
    return this.iso(y, ay+1, Math.min(gun, sonGun));
  },
  gunEkle(iso, n){
    const p = this.parcala(iso);
    const d = new Date(p.y, p.m-1, p.d + n);
    return this.iso(d.getFullYear(), d.getMonth()+1, d.getDate());
  },
  haftaGunu(iso){ const p=this.parcala(iso); return new Date(p.y,p.m-1,p.d).getDay(); }, // 0=Pazar
  gunFark(a,b){ // b - a (gün)
    const pa=this.parcala(a), pb=this.parcala(b);
    const da=new Date(pa.y,pa.m-1,pa.d), db=new Date(pb.y,pb.m-1,pb.d);
    return Math.round((db-da)/86400000);
  },
  tarihGunAdi(iso){ return ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'][this.haftaGunu(iso)]; }
};

/* ==================================================================
   Bölüm 2: Depolama Katmanı (localStorage + IndexedDB dosyalar)
   ================================================================== */
const Depo = {
  ANAHTAR:'nizamSoftMuhasebe',
  veri:null,

  varsayilan(){
    return {
      surum:1,
      firma:{ ad:'', yetkili:'', telefon:'', eposta:'', vergiDairesi:'', vergiNo:'', adres:'', logo:'' },
      ayarlar:{ paraBirimi:'TL', varsayilanTarih:'bugun', ondalik:2, tema:'acik', islemBaslangic:1 },
      anaHesaplar:[
        {kod:'102', ad:'Bankalar', tur:'banka'},
        {kod:'120', ad:'Alıcılar', tur:'alici'},
        {kod:'309', ad:'Kredi Kartları', tur:'kart'},
        {kod:'320', ad:'Satıcılar', tur:'satici'},
        {kod:'331', ad:'Ortaklara Borçlar', tur:'ortak'},
        {kod:'600', ad:'Yurtiçi Satışlar (Gelir)', tur:'gelir'},
        {kod:'770', ad:'Gider Hesapları', tur:'gider'},
        {kod:'191', ad:'İndirilecek KDV', tur:'sistem'},
        {kod:'391', ad:'Hesaplanan KDV', tur:'sistem'},
        {kod:'190', ad:'Devreden KDV', tur:'sistem'},
        {kod:'360', ad:'Ödenecek Vergi ve Fonlar', tur:'sistem'},
        {kod:'690', ad:'Dönem Kârı veya Zararı', tur:'sistem'},
        {kod:'590', ad:'Dönem Net Kârı', tur:'sistem'},
        {kod:'591', ad:'Dönem Net Zararı', tur:'sistem'}
      ],
      altHesaplar:[],   // {id,kod,anaKod,tur,ad, ...alan..., acilis, aciklama}
      islemler:[],      // {id,no,tur,tarih,...alanlar, dosyaId?}
      hareketler:[],    // {id,islemId,hesapId,tarih,islemNo,aciklama,borc,alacak,...}
      taksitPlanlari:[],// {id,islemId,hesapId,toplamTutar,taksitSayisi,kartOdemeGunu,ilkTaksitTarihi}
      taksitler:[],     // {id,planId,islemId,hesapId,taksitNo,tutar,planlananTarih,durum,gerceklesenTarih,bankaHareketId,aciklama}
      ongoruler:[],     // forecastRules {id,tur,aciklama,grupId,tutar,bankaHesapId,tekrar,baslangic,bitis,gun,ay,haftaGunu,hatirlatma,aktif,ekNot}
      ongoruGercek:[],  // forecastOccurrences (istisna/override) {id,kuralId,tarih,durum,gercekTutar,gerceklesenTarih,bankaHareketId,not}
      gruplar:[],       // incomeExpenseGroups {id,tur,ad}
      eslesmeler:[],    // transactionMatches {id,tur,kaynakId,hareketId,tarih}
      nakitAyar:{ aralik:'1ay', gorunum:'tahmin', bankaFiltre:[], yaklasanGun:7, dusukBakiye:0 },
      sayaclar:{ islemNo:0, altKod:{'102':0,'120':0,'309':0,'320':0,'331':0,'600':0,'770':0,'191':0,'391':0,'190':0,'360':0,'690':0,'590':0,'591':0} }
    };
  },

  yukle(){
    try{
      const ham = localStorage.getItem(this.ANAHTAR);
      if(ham){
        this.veri = JSON.parse(ham);
        this.butunle();
      }else{
        this.veri = this.varsayilan();
      }
      this.sistemKur();
      this.kaydet();
    }catch(e){
      console.error('Yükleme hatası',e);
      this.veri = this.varsayilan();
    }
    return this.veri;
  },

  // Eksik alanları tamamla (ileri uyumluluk)
  butunle(){
    const v = this.varsayilan();
    if(!this.veri.firma) this.veri.firma = v.firma;
    if(!this.veri.ayarlar) this.veri.ayarlar = v.ayarlar;
    if(!this.veri.anaHesaplar || this.veri.anaHesaplar.length===0) this.veri.anaHesaplar = v.anaHesaplar;
    if(!this.veri.altHesaplar) this.veri.altHesaplar = [];
    if(!this.veri.islemler) this.veri.islemler = [];
    if(!this.veri.hareketler) this.veri.hareketler = [];
    if(!this.veri.sayaclar) this.veri.sayaclar = v.sayaclar;
    if(!this.veri.sayaclar.altKod) this.veri.sayaclar.altKod = v.sayaclar.altKod;
    // Nakit akışı / taksit / öngörü koleksiyonları (eski yedeklerde eksikse tamamla)
    ['taksitPlanlari','taksitler','ongoruler','ongoruGercek','gruplar','eslesmeler'].forEach(k=>{ if(!Array.isArray(this.veri[k])) this.veri[k]=[]; });
    if(!this.veri.nakitAyar) this.veri.nakitAyar = v.nakitAyar;
    else { const na=v.nakitAyar; for(const key in na){ if(this.veri.nakitAyar[key]===undefined) this.veri.nakitAyar[key]=na[key]; } }
    // Sonradan eklenen sabit ana hesapları (331, 600, 770, KDV, kapanış) eski verilere de tamamla
    v.anaHesaplar.forEach(ana=>{
      if(!this.veri.anaHesaplar.find(h=>h.kod===ana.kod)) this.veri.anaHesaplar.push(Object.assign({},ana));
      if(this.veri.sayaclar.altKod[ana.kod]===undefined) this.veri.sayaclar.altKod[ana.kod]=0;
    });
  },

  // KDV ve kapanış için otomatik (sistem) alt hesaplar — kullanıcı bunları elle açmaz/silmez
  sistemAltTanim(){
    return [
      {id:'sis-191', kod:'191.01', anaKod:'191', tur:'sistem', ad:'İndirilecek KDV', acilis:0},
      {id:'sis-391', kod:'391.01', anaKod:'391', tur:'sistem', ad:'Hesaplanan KDV', acilis:0},
      {id:'sis-190', kod:'190.01', anaKod:'190', tur:'sistem', ad:'Devreden KDV', acilis:0},
      {id:'sis-360', kod:'360.01', anaKod:'360', tur:'sistem', ad:'Ödenecek KDV', acilis:0},
      {id:'sis-690', kod:'690.01', anaKod:'690', tur:'sistem', ad:'Dönem Kâr/Zararı', acilis:0},
      {id:'sis-590', kod:'590.01', anaKod:'590', tur:'sistem', ad:'Dönem Net Kârı', acilis:0},
      {id:'sis-591', kod:'591.01', anaKod:'591', tur:'sistem', ad:'Dönem Net Zararı', acilis:0}
    ];
  },
  sistemKur(){
    this.sistemAltTanim().forEach(s=>{
      if(!this.veri.altHesaplar.find(h=>h.id===s.id)){
        this.veri.altHesaplar.push(Object.assign({},s));
        this.veri.sayaclar.altKod[s.anaKod] = Math.max(this.veri.sayaclar.altKod[s.anaKod]||0, 1);
      }
    });
  },

  kaydet(){
    try{
      localStorage.setItem(this.ANAHTAR, JSON.stringify(this.veri));
      return true;
    }catch(e){
      Bildirim.goster('hata','Kayıt Hatası','Depolama sınırı aşılmış olabilir. Büyük dosyaları kaldırın.');
      return false;
    }
  },

  // --- Sayaç işlemleri ---
  yeniIslemNo(){
    const s = this.veri.sayaclar;
    const baslangic = Number(this.veri.ayarlar.islemBaslangic)||1;
    if(s.islemNo < baslangic-1) s.islemNo = baslangic-1;
    s.islemNo++;
    return 'ISL-' + String(s.islemNo).padStart(6,'0');
  },
  yeniAltKod(anaKod){
    if(this.veri.sayaclar.altKod[anaKod]===undefined) this.veri.sayaclar.altKod[anaKod]=0;
    this.veri.sayaclar.altKod[anaKod]++;
    return anaKod + '.' + String(this.veri.sayaclar.altKod[anaKod]).padStart(2,'0');
  }
};

/* IndexedDB - fatura dosyaları */
const DosyaDepo = {
  db:null,
  ADI:'nizamSoftDosya', STORE:'dosyalar',
  ac(){
    return new Promise((cbz,red)=>{
      if(this.db) return cbz(this.db);
      const istek = indexedDB.open(this.ADI,1);
      istek.onupgradeneeded = e=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains(this.STORE)) db.createObjectStore(this.STORE,{keyPath:'id'});
      };
      istek.onsuccess = e=>{ this.db=e.target.result; cbz(this.db); };
      istek.onerror = e=>red(e.target.error);
    });
  },
  async kaydet(kayit){
    const db = await this.ac();
    return new Promise((cbz,red)=>{
      const t = db.transaction(this.STORE,'readwrite');
      t.objectStore(this.STORE).put(kayit);
      t.oncomplete = ()=>cbz(true);
      t.onerror = e=>red(e.target.error);
    });
  },
  async getir(id){
    const db = await this.ac();
    return new Promise((cbz,red)=>{
      const istek = db.transaction(this.STORE,'readonly').objectStore(this.STORE).get(id);
      istek.onsuccess = ()=>cbz(istek.result);
      istek.onerror = e=>red(e.target.error);
    });
  },
  async sil(id){
    const db = await this.ac();
    return new Promise((cbz)=>{
      const t = db.transaction(this.STORE,'readwrite');
      t.objectStore(this.STORE).delete(id);
      t.oncomplete = ()=>cbz(true);
      t.onerror = ()=>cbz(false);
    });
  },
  async hepsi(){
    const db = await this.ac();
    return new Promise((cbz,red)=>{
      const istek = db.transaction(this.STORE,'readonly').objectStore(this.STORE).getAll();
      istek.onsuccess = ()=>cbz(istek.result||[]);
      istek.onerror = e=>red(e.target.error);
    });
  },
  async temizle(){
    const db = await this.ac();
    return new Promise((cbz)=>{
      const t = db.transaction(this.STORE,'readwrite');
      t.objectStore(this.STORE).clear();
      t.oncomplete = ()=>cbz(true);
      t.onerror = ()=>cbz(false);
    });
  }
};

const Bildirim = {

  onayGeri:null,

/* ==================================================================
   Bölüm 4: Hesap ve Bakiye Hesaplama Motoru
   ================================================================== */
const Hesap = {
  altHesaplarByAna(anaKod){
    return Depo.veri.altHesaplar.filter(h=>h.anaKod===anaKod)
      .sort((a,b)=>a.kod.localeCompare(b.kod,'tr'));
  },
  altBul(id){ return Depo.veri.altHesaplar.find(h=>h.id===id); },
  altBulKod(kod){ return Depo.veri.altHesaplar.find(h=>h.kod===kod); },
  anaBul(kod){ return Depo.veri.anaHesaplar.find(h=>h.kod===kod); },
  // Bir sistem ana hesabının (191, 391, 690, 590, 591, 360, 190) otomatik alt hesap id'si
  sistemId(anaKod){ const h = Depo.veri.altHesaplar.find(x=>x.anaKod===anaKod && x.tur==='sistem'); return h?h.id:null; },

  // Bir hesaba ait hareketleri tarih+islemNo sırasına göre döndür (Güncel Bakiye ile)
  hareketler(hesapId){
    const list = Depo.veri.hareketler.filter(h=>h.hesapId===hesapId);
    list.sort((a,b)=>{
      if(a.tarih!==b.tarih) return a.tarih.localeCompare(b.tarih);
      return (a.islemNo||'').localeCompare(b.islemNo||'');
    });
    const hesap = this.altBul(hesapId);
    let yuruyen = this.acilisBakiye(hesap); // açılış bakiyesi tabanı
    return list.map(h=>{
      const etki = (Number(h.borc)||0) - (Number(h.alacak)||0);
      yuruyen += etki;
      return Object.assign({}, h, {etki, guncelBakiye:yuruyen});
    });
  },

  // Açılış bakiyesinin bakiyeye etkisi (borç-alacak yönünde net değer)
  acilisBakiye(hesap){
    if(!hesap) return 0;
    const a = Number(hesap.acilis)||0;
    // Borç nitelikli (açılış borç, pozitif bakiye): banka, alıcı, gider (770)
    // Alacak nitelikli (açılış alacak, negatif bakiye): satıcı, kart, ortak (331), gelir (600)
    if(hesap.tur==='banka' || hesap.tur==='alici' || hesap.tur==='gider') return a;
    if(hesap.tur==='satici' || hesap.tur==='kart' || hesap.tur==='ortak' || hesap.tur==='gelir') return -a;
    return a;
  },

  // Hesabın güncel net bakiyesi (borç - alacak)
  netBakiye(hesapId){
    const hesap = this.altBul(hesapId);
    let toplam = this.acilisBakiye(hesap);
    Depo.veri.hareketler.filter(h=>h.hesapId===hesapId).forEach(h=>{
      toplam += (Number(h.borc)||0) - (Number(h.alacak)||0);
    });
    return toplam;
  },

  // Toplam borç / alacak (açılış dahil)
  toplamlar(hesapId){
    const hesap = this.altBul(hesapId);
    let tBorc=0, tAlacak=0;
    const ac = Number(hesap && hesap.acilis)||0;
    if(hesap){
      if(hesap.tur==='banka' || hesap.tur==='alici' || hesap.tur==='gider') tBorc += ac;
      else tAlacak += ac;
    }
    Depo.veri.hareketler.filter(h=>h.hesapId===hesapId).forEach(h=>{
      tBorc += Number(h.borc)||0;
      tAlacak += Number(h.alacak)||0;
    });
    return {tBorc,tAlacak};
  },

  // Ana hesap bakiyesi = alt hesap bakiyelerinin toplamı
  anaBakiye(anaKod){
    return this.altHesaplarByAna(anaKod).reduce((t,h)=>t+this.netBakiye(h.id),0);
  },

  // Kart güncel borcu (pozitif değer)
  kartBorc(hesapId){
    const b = this.netBakiye(hesapId);
    return b<0 ? -b : 0;
  },

  // Görüntüleme için hesap adı
  hesapAdi(hesap){
    if(!hesap) return '';
    return hesap.ad || hesap.firmaAd || hesap.kartAd || hesap.bankaAd || '';
  }
};

/* ==================================================================
   Bölüm 5: CSV / Excel ve Yazdırma
   ================================================================== */
const Disari = {
  csv(baslıklar, satirlar, dosyaAd){
    const ayrac = ';';
    const kacir = (v)=>{
      let s = (v===undefined||v===null)?'':String(v);
      if(s.indexOf('"')>-1 || s.indexOf(ayrac)>-1 || s.indexOf('\n')>-1){
        s = '"' + s.replace(/"/g,'""') + '"';
      }
      return s;
    };
    let icerik = baslıklar.map(kacir).join(ayrac) + '\r\n';
    satirlar.forEach(r=>{ icerik += r.map(kacir).join(ayrac) + '\r\n'; });
    const bom = '﻿';
    const blob = new Blob([bom+icerik], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = dosyaAd.replace(/\.csv$/,'') + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    Bildirim.goster('basari','Dışa Aktarıldı','CSV dosyası indirildi.');
  },
  yazdir(baslik, icerikHTML){
    const alan = document.getElementById('yazdir-alan');
    const firma = Depo.veri.firma.ad || 'Nizam Soft Ön Muhasebe';
    alan.innerHTML = `
      <div style="font-family:Segoe UI,Arial,sans-serif;padding:0">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #d32027;padding-bottom:12px;margin-bottom:18px">
          <div><h1 style="font-size:22px;color:#111">${Yardimci.kacisHTML(firma)}</h1>
          <div style="font-size:13px;color:#666">${Yardimci.kacisHTML(baslik)}</div></div>
          <div style="font-size:12px;color:#666;text-align:right">Tarih: ${Yardimci.tarihFormat(Yardimci.bugun())}</div>
        </div>
        ${icerikHTML}
        <div style="margin-top:30px;font-size:11px;color:#999;text-align:center;border-top:1px solid #ddd;padding-top:10px">
          Nizam Soft Ön Muhasebe ile oluşturulmuştur.
        </div>
      </div>`;
    window.print();
    setTimeout(()=>{ alan.innerHTML=''; }, 500);
  },
  // HTML tabloyu yazdırılabilir tabloya dönüştür
  tabloHTML(baslıklar, satirlar){
    let h = '<table style="width:100%;border-collapse:collapse;font-size:12px">';
    h += '<thead><tr>' + baslıklar.map(b=>`<th style="background:#1f2530;color:#fff;padding:8px;text-align:left;border:1px solid #ccc">${Yardimci.kacisHTML(b)}</th>`).join('') + '</tr></thead><tbody>';
    satirlar.forEach(r=>{
      h += '<tr>' + r.map(c=>`<td style="padding:7px;border:1px solid #ddd">${Yardimci.kacisHTML(c)}</td>`).join('') + '</tr>';
    });
    h += '</tbody></table>';
    return h;
  }
};

/* ==================================================================
   Bölüm 6: Ana Uygulama - Yönlendirme ve Sayfalar
   ================================================================== */
const App = {
  aktifSayfa:'anasayfa',
  aktifSekme:'alis',
  aktifRapor:null,

  baslat(){
    Depo.yukle();
    this.temaUygula();
    this.firmaGuncelle();
    this.menuBagla();
    this.sayfaGit('anasayfa');
    // Menü başlangıçta açık; küçük ekranda kapalı
    if(window.innerWidth<820) document.body.classList.add('menu-kapali');
  },

  menuBagla(){
    document.querySelectorAll('.menu-oge').forEach(el=>{
      el.addEventListener('click',()=>this.sayfaGit(el.dataset.sayfa));
    });
  },
  menuToggle(){ document.body.classList.toggle('menu-kapali'); },

  temaUygula(){
    document.body.classList.toggle('tema-koyu', Depo.veri.ayarlar.tema==='koyu');
  },

  firmaGuncelle(){
    const f = Depo.veri.firma;
    document.getElementById('ust-firma').textContent = f.ad || 'Firma Adı Girilmedi';
    const logoEl = document.getElementById('marka-logo');
    if(f.logo){ logoEl.innerHTML = `<img src="${f.logo}" alt="logo">`; }
    else{ logoEl.textContent = 'NS'; }
  },

  sayfaGit(sayfa){
    this.aktifSayfa = sayfa;
    document.querySelectorAll('.menu-oge').forEach(el=>el.classList.toggle('aktif', el.dataset.sayfa===sayfa));
    const basliklar = {anasayfa:'Ana Sayfa', islemler:'İşlem Girişleri', hesaplar:'Hesaplar', nakit:'Nakit Akışı', raporlar:'Raporlar', donem:'Dönem Sonu İşlemleri', ayarlar:'Ayarlar', yedekleme:'Yedekleme'};
    document.getElementById('sayfa-baslik').textContent = basliklar[sayfa]||'';
    const alan = document.getElementById('sayfa-alan');
    alan.innerHTML = '';
    const sarma = document.createElement('div');
    sarma.className = 'sayfa';
    alan.appendChild(sarma);
    switch(sayfa){
      case 'anasayfa': Sayfa.anasayfa(sarma); break;
      case 'islemler': Sayfa.islemler(sarma); break;
      case 'hesaplar': Sayfa.hesaplar(sarma); break;
      case 'nakit': Sayfa.nakit(sarma); break;
      case 'raporlar': Sayfa.raporlar(sarma); break;
      case 'donem': Sayfa.donem(sarma); break;
      case 'ayarlar': Sayfa.ayarlar(sarma); break;
      case 'yedekleme': Sayfa.yedekleme(sarma); break;
    }
    if(window.innerWidth<820) document.body.classList.add('menu-kapali');
  },

  modalKapat(){ Modal.kapat(); }
};

/* ==================================================================
   Bölüm 7: Sayfa Oluşturucular
   ================================================================== */
const Sayfa = {
  /* ---------- ANA SAYFA ---------- */
  anasayfa(el){
    const bankaBakiye = Depo.veri.anaHesaplar.length ? Hesap.anaBakiye('102') : 0;
    const alacaklar = Hesap.anaBakiye('120');       // müşteri borcu = bizim alacağımız
    const saticiBorc = -Hesap.anaBakiye('320');     // satıcıya borcumuz (alacak yönlü)
    const kartBorc = -Hesap.anaBakiye('309');       // kart borcu

    el.innerHTML = `
      <div class="ozet-grid">
        ${this.ozetKart('i-mavi','🏦','Toplam Banka Bakiyesi', bankaBakiye)}
        ${this.ozetKart('i-yesil','📥','Toplam Alacaklar', alacaklar)}
        ${this.ozetKart('i-kirmizi','📤','Toplam Satıcı Borçları', saticiBorc)}
        ${this.ozetKart('i-turuncu','💳','Toplam Kredi Kartı Borcu', kartBorc)}
      </div>
      <div class="kart">
        <h2 class="bolum-baslik">Son İşlemler</h2>
        <div id="son-islemler"></div>
      </div>`;
    this.sonIslemler(el.querySelector('#son-islemler'));
  },

  ozetKart(renk, ikon, etiket, deger){
    return `<div class="ozet-kart">
      <div class="ust"><div class="ozet-ikon ${renk}">${ikon}</div>
        <div><div class="etiket">${etiket}</div></div></div>
      <div class="deger">${Yardimci.paraFormat(deger)}</div>
    </div>`;
  },

  sonIslemler(el){
    const islemler = [...Depo.veri.islemler].sort((a,b)=>(b.no||'').localeCompare(a.no||'')).slice(0,12);
    if(islemler.length===0){
      el.innerHTML = `<div class="bos-mesaj">Henüz kayıtlı işlem bulunmuyor.</div>`;
      return;
    }
    const satir = islemler.map(is=>{
      const hesap = this.islemHesapAdi(is);
      const tur = this.islemTurAdi(is.tur);
      const {borc,alacak} = this.islemBorcAlacak(is);
      return `<tr>
        <td><span class="kod-rozet">${is.no}</span></td>
        <td>${Yardimci.tarihFormat(is.tarih)}</td>
        <td>${tur}</td>
        <td>${Yardimci.kacisHTML(hesap)}</td>
        <td>${Yardimci.kacisHTML(is.aciklama||'')}</td>
        <td class="sag-hiza borc">${borc?Yardimci.paraFormat(borc):'-'}</td>
        <td class="sag-hiza alacak">${alacak?Yardimci.paraFormat(alacak):'-'}</td>
      </tr>`;
    }).join('');
    el.innerHTML = `<div class="tablo-sar"><table class="veri">
      <thead><tr><th>İşlem No</th><th>Tarih</th><th>İşlem Türü</th><th>Hesap</th><th>Açıklama</th><th class="sag-hiza">Borç</th><th class="sag-hiza">Alacak</th></tr></thead>
      <tbody>${satir}</tbody></table></div>`;
  },

  islemTurAdi(tur){
    return {alis:'Alış Faturası', satis:'Satış Faturası', banka:'Banka Hareketi', kart:'Kredi Kartı', kdvmahsup:'KDV Mahsubu', kapanis:'Dönem Kapanışı'}[tur]||tur;
  },
  islemHesapAdi(is){
    const h = Hesap.altBul(is.hesapId);
    return h ? (h.kod + ' ' + Hesap.hesapAdi(h)) : '-';
  },
  islemBorcAlacak(is){
    // ana hesaba yansıyan borç/alacak
    const har = Depo.veri.hareketler.find(h=>h.islemId===is.id);
    if(har) return {borc:Number(har.borc)||0, alacak:Number(har.alacak)||0};
    return {borc:0,alacak:0};
  },

  /* ---------- İŞLEM GİRİŞLERİ ---------- */
  islemler(el){
    el.innerHTML = `
      <div class="sekmeler no-print">
        <button class="sekme" data-sekme="alis">Alış Faturaları</button>
        <button class="sekme" data-sekme="satis">Satış Faturaları</button>
        <button class="sekme" data-sekme="banka">Banka Hareketleri</button>
        <button class="sekme" data-sekme="kart">Kredi Kartı Ödemeleri</button>
      </div>
      <div id="sekme-icerik"></div>`;
    el.querySelectorAll('.sekme').forEach(s=>{
      s.addEventListener('click',()=>{ App.aktifSekme = s.dataset.sekme; this.sekmeGuncelle(el); });
    });
    this.sekmeGuncelle(el);
  },

  sekmeGuncelle(el){
    el.querySelectorAll('.sekme').forEach(s=>s.classList.toggle('aktif', s.dataset.sekme===App.aktifSekme));
    const ic = el.querySelector('#sekme-icerik');
    Form.render(ic, App.aktifSekme);
  },

  /* ---------- HESAPLAR ---------- */
  hesaplar(el){
    el.innerHTML = `
      <div class="kart">
        <h2 class="bolum-baslik">Hesap Planı</h2>
        <div class="arac-cubuk no-print">
          <div class="arama-kutu"><input type="text" id="hesap-arama" placeholder="Hesap kodu, adı, banka, alıcı, satıcı veya kart ara..."></div>
          <button class="btn ${this._sonucGoster?'btn-kirmizi':'btn-cizgi'} btn-kucuk" onclick="Sayfa.sonucAcKapa()">${this._sonucGoster?'👁 Sonuç/Vergi Hesaplarını Gizle':'👁 Sonuç/Vergi Hesaplarını Göster'}</button>
          <button class="btn btn-koyu btn-kucuk" onclick="Disari.yazdir('Hesap Planı', Sayfa.hesapPlaniYazdir())">🖨 Yazdır</button>
          <button class="btn btn-yesil btn-kucuk" onclick="Sayfa.hesapPlaniExcel()">📊 Excel</button>
        </div>
        <div id="hesap-tablo"></div>
      </div>`;
    el.querySelector('#hesap-arama').addEventListener('input', e=>this.hesapTablo(el.querySelector('#hesap-tablo'), e.target.value));
    this.hesapTablo(el.querySelector('#hesap-tablo'),'');
  },

  // Sonuç/vergi hesapları: varsayılan gizli, düğme ile açılır
  gizliAna(ana){ return ['gelir','gider','sistem'].includes(ana.tur); },
  sonucAcKapa(){ this._sonucGoster = !this._sonucGoster; App.sayfaGit('hesaplar'); },

  hesapTablo(el, aranan){
    const q = (aranan||'').toLocaleLowerCase('tr');
    let govde = '';
    Depo.veri.anaHesaplar.forEach(ana=>{
      // Sonuç/vergi hesapları gizliyse ve arama yoksa atla
      if(this.gizliAna(ana) && !this._sonucGoster && !q) return;
      const altlar = Hesap.altHesaplarByAna(ana.kod).filter(h=>{
        if(!q) return true;
        const metin = (h.kod+' '+Hesap.hesapAdi(h)+' '+(h.bankaAd||'')+' '+(h.ad||'')).toLocaleLowerCase('tr');
        return metin.indexOf(q)>-1;
      });
      // Ana hesabı gizleme: arama varsa ve alt yoksa ve ana ad eşleşmiyorsa atla
      const anaEsles = !q || (ana.kod+' '+ana.ad).toLocaleLowerCase('tr').indexOf(q)>-1;
      if(q && altlar.length===0 && !anaEsles) return;
      const sistemAna = ana.tur==='sistem';
      // Accordion: arama yoksa varsayılan kapalı; arama varsa otomatik açık
      const acik = q ? true : !!(this._acik && this._acik[ana.kod]);
      const ok = acik ? '▼' : '▶';
      const ekleBtn = sistemAna ? '' : `<button class="btn btn-kirmizi btn-kucuk" onclick="event.stopPropagation();AltHesap.ekleModal('${ana.kod}')">+ Alt Hesap Ekle</button>`;
      govde += `<tr class="ana-hesap-satir" style="cursor:pointer" onclick="Sayfa.anaAcKapa('${ana.kod}')" title="Alt hesapları aç/kapat">
        <td><span style="display:inline-block;width:14px;color:var(--kirmizi);font-size:11px">${ok}</span> <span class="kod-rozet">${ana.kod}</span></td>
        <td>${ana.ad} <span style="color:var(--metin-soluk);font-weight:400">(${altlar.length})</span></td>
        <td class="sag-hiza">${Yardimci.paraFormat(Hesap.anaBakiye(ana.kod))}</td>
        <td class="no-print">${ekleBtn}</td>
      </tr>`;
      if(acik){
        if(altlar.length===0){
          govde += `<tr><td></td><td colspan="3" style="color:var(--metin-soluk);font-style:italic">Alt hesap bulunmuyor.</td></tr>`;
        }
        altlar.forEach(h=>{
          const duzenleSil = h.tur==='sistem' ? '' : `
              <button class="btn btn-cizgi btn-kucuk" onclick="event.stopPropagation();AltHesap.duzenleModal('${h.id}')">Düzenle</button>
              <button class="btn btn-cizgi btn-kucuk" onclick="event.stopPropagation();AltHesap.sil('${h.id}')">Sil</button>`;
          govde += `<tr onclick="Detay.ac('${h.id}')" style="cursor:pointer">
            <td class="girinti"><span class="kod-rozet">${h.kod}</span></td>
            <td>${Yardimci.kacisHTML(Hesap.hesapAdi(h))}</td>
            <td class="sag-hiza">${Yardimci.paraFormat(Hesap.netBakiye(h.id))}</td>
            <td class="no-print satir-ic">
              <button class="btn btn-cizgi btn-kucuk" onclick="event.stopPropagation();Detay.ac('${h.id}')">Aç</button>${duzenleSil}
            </td>
          </tr>`;
        });
      }
    });
    el.innerHTML = `<div class="tablo-sar"><table class="veri">
      <thead><tr><th>Hesap Kodu</th><th>Hesap Adı</th><th class="sag-hiza">Bakiye</th><th class="no-print">İşlemler</th></tr></thead>
      <tbody>${govde}</tbody></table></div>`;
  },

  // Ana hesabın alt hesaplarını aç/kapat (accordion)
  anaAcKapa(kod){
    if(!this._acik) this._acik = {};
    this._acik[kod] = !this._acik[kod];
    const el = document.getElementById('hesap-tablo');
    const arama = document.getElementById('hesap-arama');
    if(el) this.hesapTablo(el, arama ? arama.value : '');
  },

  hesapPlaniYazdir(){
    const satirlar = [];
    Depo.veri.anaHesaplar.forEach(ana=>{
      satirlar.push([ana.kod, ana.ad, Yardimci.paraFormat(Hesap.anaBakiye(ana.kod))]);
      Hesap.altHesaplarByAna(ana.kod).forEach(h=>{
        satirlar.push(['   '+h.kod, Hesap.hesapAdi(h), Yardimci.paraFormat(Hesap.netBakiye(h.id))]);
      });
    });
    return Disari.tabloHTML(['Hesap Kodu','Hesap Adı','Bakiye'], satirlar);
  },
  hesapPlaniExcel(){
    const satirlar = [];
    Depo.veri.anaHesaplar.forEach(ana=>{
      satirlar.push([ana.kod, ana.ad, Yardimci.sayiFormat(Hesap.anaBakiye(ana.kod))]);
      Hesap.altHesaplarByAna(ana.kod).forEach(h=>{
        satirlar.push([h.kod, Hesap.hesapAdi(h), Yardimci.sayiFormat(Hesap.netBakiye(h.id))]);
      });
    });
    Disari.csv(['Hesap Kodu','Hesap Adı','Bakiye'], satirlar, 'hesap-plani');
  },

const Form = {
  aktifKayit:{alis:null, satis:null, banka:null, kart:null},
  bekleyenDosya:null, // {ad,tur,boyut,data}

  render(el, tur){
    this.bekleyenDosya = null;
    if(tur==='alis') this.alis(el);
    else if(tur==='satis') this.satis(el);
    else if(tur==='banka') this.banka(el);
    else if(tur==='kart') this.kart(el);
  },

  butonlar(tur){
    return `<div class="buton-grup no-print" style="margin-top:22px">
      <button class="btn btn-koyu" onclick="Form.yeni('${tur}')">＋ Yeni Kayıt</button>
      <button class="btn btn-kirmizi" onclick="Form.kaydet('${tur}')">💾 Kaydet</button>
      <button class="btn btn-gri" onclick="Form.duzenleAktif('${tur}')">✎ Düzenle</button>
      <button class="btn btn-gri" onclick="Form.sil('${tur}')">🗑 Sil</button>
      <button class="btn btn-cizgi" onclick="Form.vazgec('${tur}')">✕ Vazgeç</button>
      <button class="btn btn-koyu" onclick="Form.yazdir('${tur}')">🖨 Yazdır</button>
      <button class="btn btn-yesil" onclick="Form.excel('${tur}')">📊 Excel'e Aktar</button>
    </div>`;
  },

  hesapSecenek(anaKod, secili){
    const opts = Hesap.altHesaplarByAna(anaKod).map(h=>
      `<option value="${h.id}" ${h.id===secili?'selected':''}>${h.kod} - ${Yardimci.kacisHTML(Hesap.hesapAdi(h))}</option>`).join('');
    return `<option value="">— Seçiniz —</option>` + opts;
  },

  giderSecenek(secili){
    // Gelir/Gider hesabı: 600 (gelir), 770 (gider) ve 331 (ortak) alt hesaplarından seçilir
    let opts = '';
    Depo.veri.altHesaplar
      .filter(h=>h.anaKod==='600' || h.anaKod==='770' || h.anaKod==='331')
      .sort((a,b)=>a.kod.localeCompare(b.kod,'tr'))
      .forEach(h=>{
        opts += `<option value="${h.id}" ${h.id===secili?'selected':''}>${h.kod} - ${Yardimci.kacisHTML(Hesap.hesapAdi(h))}</option>`;
      });
    return `<option value="">— Yok —</option>` + opts;
  },

  sahisSecenek(secili){
    // Şahıs/Firma yalnızca 120 Alıcılar, 320 Satıcılar ve 331 Ortaklara Borçlar alt hesaplarından seçilir
    let opts = '';
    Depo.veri.altHesaplar
      .filter(h=>h.anaKod==='120' || h.anaKod==='320' || h.anaKod==='331')
      .sort((a,b)=>a.kod.localeCompare(b.kod,'tr'))
      .forEach(h=>{
        opts += `<option value="${h.id}" ${h.id===secili?'selected':''}>${h.kod} - ${Yardimci.kacisHTML(Hesap.hesapAdi(h))}</option>`;
      });
    return `<option value="">— Seçiniz —</option>` + opts;
  },

  // KDV alanları: kullanıcı KDV DAHİL tutarı ve oranı girer; matrah ve KDV otomatik hesaplanır
  kdvAlan(on){
    return `
      <div class="form-alan"><label>Fatura Tutarı (KDV Dahil) <span class="zorunlu">*</span></label>
        <input type="number" id="${on}-tutar" min="0" step="0.01" placeholder="0,00" oninput="Form.kdvHesapla('${on}')"></div>
      <div class="form-alan"><label>KDV Oranı (%)</label>
        <input type="number" id="${on}-kdvoran" list="kdv-oranlar" min="0" max="100" step="1" value="20" oninput="Form.kdvHesapla('${on}')">
        <datalist id="kdv-oranlar"><option value="0"><option value="1"><option value="10"><option value="20"></datalist></div>
      <div class="form-alan"><label>Matrah (KDV Hariç)</label><input id="${on}-matrah" readonly placeholder="0,00"></div>
      <div class="form-alan"><label>KDV Tutarı</label><input id="${on}-kdv" readonly placeholder="0,00"></div>`;
  },

  // KDV dahil tutar + oran -> matrah ve KDV
  kdvHesapla(on){
    const toplam = Yardimci.paraCoz(document.getElementById(on+'-tutar').value);
    const oran = Number(document.getElementById(on+'-kdvoran').value)||0;
    const matrah = oran>0 ? toplam/(1+oran/100) : toplam;
    const kdv = toplam - matrah;
    const mEl = document.getElementById(on+'-matrah'), kEl = document.getElementById(on+'-kdv');
    if(mEl) mEl.value = Yardimci.sayiFormat(matrah);
    if(kEl) kEl.value = Yardimci.sayiFormat(kdv);
  },

  varsayilanTarih(){
    return Depo.veri.ayarlar.varsayilanTarih==='bos' ? '' : Yardimci.bugun();
  },

  kart(el){

    el.innerHTML = `
      <div class="kart">
        <div class="form-baslik">Kredi Kartı Harcaması Girişi</div>
        <div class="form-grid">
          <div class="form-alan"><label>İşlem No</label><input id="kk-no" value="${no}" readonly></div>
          <div class="form-alan"><label>İşlem Tarihi <span class="zorunlu">*</span></label><input type="date" id="kk-tarih" value="${this.varsayilanTarih()}" oninput="Form.taksitOnizle()"></div>
          <div class="form-alan"><label>Kredi Kartı Hesabı <span class="zorunlu">*</span></label><select id="kk-hesap" onchange="Form.kartSecildi()">${this.hesapSecenek('309')}</select></div>
          <div class="form-alan"><label>İşlem Adı <span class="zorunlu">*</span></label><input id="kk-islemad" placeholder="Örn: Bilgisayar Alımı"></div>

          <div class="form-alan"><label>Toplam Tutar <span class="zorunlu">*</span></label><input type="number" id="kk-tutar" min="0" step="0.01" placeholder="0,00" oninput="Form.taksitOnizle()"></div>
          <div class="form-alan"><label>Ödeme Tipi <span class="zorunlu">*</span></label>
            <select id="kk-odemetipi" onchange="Form.kartOdemeTipi()"><option value="tek">Tek Çekim</option><option value="taksit">Taksitli</option></select></div>
          <div class="form-alan"><label>Taksit Sayısı</label>
            <select id="kk-taksitsec" onchange="Form.taksitSecim()" disabled>
              <option value="2">2</option><option value="3">3</option><option value="4">4</option>
              <option value="6">6</option><option value="9">9</option><option value="12">12</option>
              <option value="custom">Kullanıcı Tanımlı</option></select></div>
          <div class="form-alan"><label>Taksit Sayısı (Elle)</label><input type="number" id="kk-taksit" min="1" max="120" value="1" readonly oninput="Form.taksitOnizle()"></div>
          <div class="form-alan"><label>İlk Taksit Tarihi</label><input type="date" id="kk-ilktaksit" oninput="Form.taksitOnizle()"></div>
          <div class="form-alan"><label>Kart Ödeme Günü</label><input type="number" id="kk-odemegunu" min="1" max="31" placeholder="Ayın günü" oninput="Form.taksitOnizle()"></div>
          <div class="form-alan tam"><label>Açıklama</label><input id="kk-aciklama"></div>
          ${this.dosyaAlan()}
          <div class="form-alan tam"><label>Ek Not</label><textarea id="kk-not"></textarea></div>
        </div>
        <div id="kk-taksit-onizle" style="margin-top:16px"></div>

    this.dosyaBagla('kart');
    this.taksitOnizle();
  },

  // Kart seçilince ödeme günü ve ilk taksit tarihini otomatik doldur
  kartSecildi(){
    const h = Hesap.altBul(document.getElementById('kk-hesap').value);
    if(!h) return;
    const gun = h.sonOdemeGun || h.kesimGun;
    if(gun){
      const og = document.getElementById('kk-odemegunu');
      if(og && !og.value) og.value = gun;
    }
    this.ilkTaksitOner();
    this.taksitOnizle();
  },
  // İlk taksit tarihi: harcama tarihinden sonraki, ödeme günündeki ilk tarih
  ilkTaksitOner(){
    const el = document.getElementById('kk-ilktaksit');
    if(!el || el.value) return;
    const tarih = document.getElementById('kk-tarih').value || Yardimci.bugun();
    const gun = Number(document.getElementById('kk-odemegunu').value)||0;
    if(!gun) return;
    const p = Yardimci.parcala(tarih);
    let ay = p.m, y = p.y;
    // harcama gününden sonraki ilk ödeme günü
    let sonGun = Yardimci.ayinSonGunu(y, ay);
    if(p.d >= Math.min(gun, sonGun)){ ay++; if(ay>12){ay=1;y++;} }
    sonGun = Yardimci.ayinSonGunu(y, ay);
    el.value = Yardimci.iso(y, ay, Math.min(gun, sonGun));
  },
  kartOdemeTipi(){
    const tip = document.getElementById('kk-odemetipi').value;
    const sec = document.getElementById('kk-taksitsec'), elle = document.getElementById('kk-taksit');
    if(tip==='tek'){ sec.disabled=true; elle.value=1; elle.readOnly=true; }
    else{ sec.disabled=false; elle.readOnly=false; this.taksitSecim(); }
    this.taksitOnizle();
  },
  taksitSecim(){
    const sec = document.getElementById('kk-taksitsec').value;
    const elle = document.getElementById('kk-taksit');
    if(sec==='custom'){ elle.readOnly=false; elle.focus(); }
    else{ elle.value = sec; elle.readOnly=true; }
    this.taksitOnizle();
  },
  // Taksit planı önizleme
  taksitOnizle(){
    const el = document.getElementById('kk-taksit-onizle');
    if(!el) return;
    const toplam = Yardimci.paraCoz((document.getElementById('kk-tutar')||{}).value);
    const adet = Math.max(1, Number((document.getElementById('kk-taksit')||{}).value)||1);
    if(toplam<=0){ el.innerHTML=''; return; }
    const taksitler = Taksit.hesapla(toplam, adet, this.taksitIlkTarih());
    el.innerHTML = `<div class="mini-liste-baslik">Taksit Planı Önizleme (${adet} taksit)</div>
      <div class="tablo-sar"><table class="veri"><thead><tr><th>Taksit</th><th>Planlanan Tarih</th><th class="sag-hiza">Tutar</th></tr></thead><tbody>
      ${taksitler.map(t=>`<tr><td>${t.no}. Taksit</td><td>${Yardimci.tarihFormat(t.tarih)}</td><td class="sag-hiza">${Yardimci.paraFormat(t.tutar)}</td></tr>`).join('')}
      </tbody></table></div>`;
  },
  taksitIlkTarih(){
    let ilk = (document.getElementById('kk-ilktaksit')||{}).value;
    if(ilk) return ilk;
    // ödeme günü + harcama tarihinden türet
    this.ilkTaksitOner();
    ilk = (document.getElementById('kk-ilktaksit')||{}).value;
    return ilk || document.getElementById('kk-tarih').value || Yardimci.bugun();
  },

  dosyaAlan(){
    return `<div class="form-alan tam"><label>Fatura Dosyası (PDF, JPG, PNG)</label>
      <div class="dosya-kutu">
        <input type="file" id="dosya-giris" accept=".pdf,.jpg,.jpeg,.png">
        <div class="dosya-bilgi" id="dosya-bilgi"><span style="color:var(--metin-soluk)">Dosya seçilmedi</span></div>
        <div class="buton-grup no-print" id="dosya-butonlar" style="margin-top:10px;display:none">
          <button type="button" class="btn btn-cizgi btn-kucuk" onclick="Form.dosyaGoruntule()">👁 Görüntüle</button>
          <button type="button" class="btn btn-cizgi btn-kucuk" onclick="Form.dosyaIndir()">⬇ İndir</button>
          <button type="button" class="btn btn-cizgi btn-kucuk" onclick="Form.dosyaKaldir()">✕ Dosyayı Kaldır</button>
        </div>
      </div></div>`;
  },

  dosyaBagla(tur){
    const giris = document.getElementById('dosya-giris');
    if(!giris) return;
    giris.addEventListener('change', e=>{
      const dosya = e.target.files[0];
      if(!dosya) return;
      const uzanti = dosya.name.split('.').pop().toLowerCase();
      if(!['pdf','jpg','jpeg','png'].includes(uzanti)){
        Bildirim.goster('hata','Geçersiz Dosya','Yalnızca PDF, JPG, JPEG veya PNG dosyası seçebilirsiniz.');
        e.target.value=''; return;
      }
      const SINIR = 4.5*1024*1024;
      if(dosya.size > SINIR){
        Bildirim.goster('uyari','Dosya Çok Büyük','Dosya boyutu tarayıcı depolama sınırını aşabilir. Lütfen daha küçük bir dosya seçin.');
        e.target.value=''; return;
      }
      const okuyucu = new FileReader();
      okuyucu.onload = ()=>{
        this.bekleyenDosya = {ad:dosya.name, tur:dosya.type, boyut:dosya.size, data:okuyucu.result};
        this.dosyaBilgiGoster();
      };
      okuyucu.readAsDataURL(dosya);
    });
  },

  dosyaBilgiGoster(){
    const bilgi = document.getElementById('dosya-bilgi');
    const butonlar = document.getElementById('dosya-butonlar');
    if(!bilgi) return;
    if(this.bekleyenDosya){
      bilgi.innerHTML = `<span class="dosya-adi">📎 ${Yardimci.kacisHTML(this.bekleyenDosya.ad)}</span> <span style="color:var(--metin-soluk)">(${Yardimci.boyutFormat(this.bekleyenDosya.boyut)})</span>`;
      if(butonlar) butonlar.style.display = 'flex';
    }else{
      bilgi.innerHTML = `<span style="color:var(--metin-soluk)">Dosya seçilmedi</span>`;
      if(butonlar) butonlar.style.display = 'none';
    }
  },

  dosyaGoruntule(){ if(this.bekleyenDosya) DosyaGoster.goster(this.bekleyenDosya); },
  dosyaIndir(){ if(this.bekleyenDosya) DosyaGoster.indir(this.bekleyenDosya); },
  dosyaKaldir(){ this.bekleyenDosya=null; const g=document.getElementById('dosya-giris'); if(g)g.value=''; this.dosyaBilgiGoster(); },

  // Zorunlu alan doğrulama
  dogrula(alanlar){
    for(const a of alanlar){
      const el = document.getElementById(a.id);
      const deger = el ? el.value.trim() : '';
      if(!deger){
        Bildirim.goster('hata','Eksik Alan', a.ad + ' alanı zorunludur.');
        if(el) el.focus();
        return false;
      }
      if(a.sayi){
        const n = Yardimci.paraCoz(deger);
        if(n<=0){ Bildirim.goster('hata','Geçersiz Tutar', a.ad + ' sıfırdan büyük olmalıdır.'); if(el)el.focus(); return false; }
      }
    }
    return true;
  },

  /* ---- KAYDET ---- */
  async kaydet(tur){
    if(tur==='alis') return this.kaydetFatura('alis');
    if(tur==='satis') return this.kaydetFatura('satis');
    if(tur==='banka') return this.kaydetHareket('banka');
    if(tur==='kart') return this.kaydetKart();
  },

  async kaydetKart(){
    if(!this.dogrula([
      {id:'kk-tarih', ad:'İşlem Tarihi'},
      {id:'kk-hesap', ad:'Kredi Kartı Hesabı'},
      {id:'kk-islemad', ad:'İşlem Adı'},
      {id:'kk-tutar', ad:'Toplam Tutar', sayi:true}
    ])) return;
    const duzenId = this.aktifKayit['kart'];
    const eskiKayit = duzenId ? Depo.veri.islemler.find(x=>x.id===duzenId) : null;
    const hesapId = document.getElementById('kk-hesap').value;
    const tutar = Yardimci.paraCoz(document.getElementById('kk-tutar').value);
    const odemeTipi = document.getElementById('kk-odemetipi').value;
    let adet = odemeTipi==='tek' ? 1 : Math.max(1, Number(document.getElementById('kk-taksit').value)||1);
    const sahisId = document.getElementById('kk-sahis').value || null;

    const ilkTaksit = this.taksitIlkTarih();

    // dosya kaydı

      if(eskiKayit && eskiKayit.dosyaId) await DosyaDepo.sil(eskiKayit.dosyaId);
      dosyaId = Yardimci.yeniId();
      await DosyaDepo.kaydet({id:dosyaId, ad:this.bekleyenDosya.ad, tur:this.bekleyenDosya.tur, boyut:this.bekleyenDosya.boyut, data:this.bekleyenDosya.data});
      dosyaMeta = {ad:this.bekleyenDosya.ad, tur:this.bekleyenDosya.tur, boyut:this.bekleyenDosya.boyut};
    }else if(eskiKayit){ dosyaId=eskiKayit.dosyaId; dosyaMeta=eskiKayit.dosyaMeta; }

    const islem = {
      id: duzenId || Yardimci.yeniId(),
      no: duzenId ? eskiKayit.no : Depo.yeniIslemNo(),
      tur: 'kart',
      tarih: document.getElementById('kk-tarih').value,
      hesapId: hesapId,
      islemAd: document.getElementById('kk-islemad').value.trim(),
      sahisHesapId: sahisId,
      sahis: sahisH ? (sahisH.kod+' '+Hesap.hesapAdi(sahisH)) : '',
      giderHesapId: document.getElementById('kk-gider').value || null,
      tutar: tutar,
      odemeTipi: odemeTipi,

    if(duzenId){ const i=Depo.veri.islemler.findIndex(x=>x.id===duzenId); Depo.veri.islemler[i]=islem; }
    else Depo.veri.islemler.push(islem);

    Taksit.olustur(islem);
    Depo.kaydet();

    this.aktifKayit['kart']=null; this.bekleyenDosya=null;
    App.sayfaGit('islemler');
  },

  async kaydetFatura(tur){
    const on = tur==='alis'?'al':'sa';
    const anaKod = tur==='alis'?'320':'120';
    if(!this.dogrula([
      {id:on+'-tarih', ad:'Tarih'},
      {id:on+'-hesap', ad:(tur==='alis'?'Satıcı':'Alıcı')+' Hesabı'},

      {id:on+'-tutar', ad:'Fatura Tutarı', sayi:true}
    ])) return;

    const hesapId = document.getElementById(on+'-hesap').value;

    const matrah = kdvOran>0 ? tutar/(1+kdvOran/100) : tutar;
    const kdvTutar = tutar - matrah;
    const duzenId = this.aktifKayit[tur];

    // dosya kaydı
    let dosyaId = null, dosyaMeta = null;
    const eskiKayit = duzenId ? Depo.veri.islemler.find(x=>x.id===duzenId) : null;
    if(this.bekleyenDosya){
      if(eskiKayit && eskiKayit.dosyaId){ await DosyaDepo.sil(eskiKayit.dosyaId); }
      dosyaId = Yardimci.yeniId();
      await DosyaDepo.kaydet({id:dosyaId, ad:this.bekleyenDosya.ad, tur:this.bekleyenDosya.tur, boyut:this.bekleyenDosya.boyut, data:this.bekleyenDosya.data});
      dosyaMeta = {ad:this.bekleyenDosya.ad, tur:this.bekleyenDosya.tur, boyut:this.bekleyenDosya.boyut};
    }else if(eskiKayit){
      dosyaId = eskiKayit.dosyaId; dosyaMeta = eskiKayit.dosyaMeta;
    }

    const islem = {
      id: duzenId || Yardimci.yeniId(),
      no: duzenId ? eskiKayit.no : Depo.yeniIslemNo(),
      tur: tur,
      tarih: document.getElementById(on+'-tarih').value,
      hesapId: hesapId,
      faturaNo: document.getElementById(on+'-faturano').value.trim(),
      aciklama: document.getElementById(on+'-aciklama').value.trim(),
      tutar: tutar,        // KDV dahil genel toplam (cariye işlenir)
      matrah: matrah,      // KDV hariç
      kdvOran: kdvOran,
      kdvTutar: kdvTutar,
      durum: document.getElementById(on+'-durum').value,
      ekNot: document.getElementById(on+'-not').value.trim(),
      dosyaId: dosyaId,
      dosyaMeta: dosyaMeta
    };

    if(duzenId){
      const i = Depo.veri.islemler.findIndex(x=>x.id===duzenId);
      Depo.veri.islemler[i] = islem;
    }else{
      Depo.veri.islemler.push(islem);
    }
    this.hareketUret(islem);
    Depo.kaydet();
    Bildirim.goster('basari','Başarılı', duzenId?'Kayıt başarıyla güncellendi.':'Kayıt başarıyla oluşturuldu.');
    this.aktifKayit[tur]=null; this.bekleyenDosya=null;
    App.sayfaGit('islemler');
  },

  // İşlemden hesap hareketi/hareketleri üret (çoklu hesaba genişletilebilir yapı)
  hareketUret(islem){
    // önce bu işleme ait eski hareketleri kaldır
    Depo.veri.hareketler = Depo.veri.hareketler.filter(h=>h.islemId!==islem.id);
    const hareketler = [];
    if(islem.tur==='alis'){
      // Satıcıya toplam borç artar -> Alacak (satıcı hesabına, KDV dahil)
      hareketler.push(this.hareket(islem, islem.hesapId, 0, islem.tutar, islem.aciklama||islem.faturaNo));
      // İndirilecek KDV (191) -> Borç (devletten alacağımız KDV)
      const kdv = Number(islem.kdvTutar)||0;
      const id191 = Hesap.sistemId('191');
      if(kdv>0 && id191) hareketler.push(this.hareket(islem, id191, kdv, 0, 'İndirilecek KDV - '+(islem.faturaNo||'')));
    }else if(islem.tur==='satis'){
      // Alıcının toplam borcu artar -> Borç (alıcı hesabına, KDV dahil)
      hareketler.push(this.hareket(islem, islem.hesapId, islem.tutar, 0, islem.aciklama||islem.faturaNo));
      // Hesaplanan KDV (391) -> Alacak (devlete borcumuz olan KDV)
      const kdv = Number(islem.kdvTutar)||0;
      const id391 = Hesap.sistemId('391');
      if(kdv>0 && id391) hareketler.push(this.hareket(islem, id391, 0, kdv, 'Hesaplanan KDV - '+(islem.faturaNo||'')));
    }else if(islem.tur==='banka'){
      // Para girişi -> Borç, Para çıkışı -> Alacak (banka hesabına)
      const giris = islem.islemTuru==='giris';
      if(giris) hareketler.push(this.hareket(islem, islem.hesapId, islem.tutar, 0, islem.islemAd));
      else hareketler.push(this.hareket(islem, islem.hesapId, 0, islem.tutar, islem.islemAd));
      // Karşı hesaplar: bankanın AYNASININ TERSİ yönde (Para Çıkışı -> karşıya Borç)
      if(islem.sahisHesapId && Hesap.altBul(islem.sahisHesapId)){
        if(giris) hareketler.push(this.hareket(islem, islem.sahisHesapId, 0, islem.tutar, islem.islemAd));
        else hareketler.push(this.hareket(islem, islem.sahisHesapId, islem.tutar, 0, islem.islemAd));
      }
      if(islem.giderHesapId && Hesap.altBul(islem.giderHesapId)){
        if(giris) hareketler.push(this.hareket(islem, islem.giderHesapId, 0, islem.tutar, islem.islemAd));
        else hareketler.push(this.hareket(islem, islem.giderHesapId, islem.tutar, 0, islem.islemAd));
      }
    }else if(islem.tur==='kart'){
      // Kredi kartı HARCAMASI -> kart borcu artar (kart hesabına Alacak)
      hareketler.push(this.hareket(islem, islem.hesapId, 0, islem.tutar, islem.islemAd));
      // Karşı gider/şahıs hesabına Borç (mirror)
      if(islem.giderHesapId && Hesap.altBul(islem.giderHesapId)){
        hareketler.push(this.hareket(islem, islem.giderHesapId, islem.tutar, 0, islem.islemAd));
      }else if(islem.sahisHesapId && Hesap.altBul(islem.sahisHesapId)){
        hareketler.push(this.hareket(islem, islem.sahisHesapId, islem.tutar, 0, islem.islemAd));
      }
    }
    Depo.veri.hareketler.push(...hareketler);
  },

  hareket(islem, hesapId, borc, alacak, aciklama){
    return {
      id: Yardimci.yeniId(),
      islemId: islem.id,
      islemNo: islem.no,
      hesapId: hesapId,
      tarih: islem.tarih,
      aciklama: aciklama || islem.aciklama || '',
      borc: Number(borc)||0,
      alacak: Number(alacak)||0
    };
  },

  /* ---- YENİ / DÜZENLE / SİL / VAZGEÇ ---- */
  yeni(tur){ this.aktifKayit[tur]=null; App.sayfaGit('islemler'); Bildirim.goster('bilgi','Yeni Kayıt','Form yeni kayıt için temizlendi.',1800); },
  vazgec(tur){ this.aktifKayit[tur]=null; App.sayfaGit('islemler'); },
  duzenleAktif(tur){
    if(!this.aktifKayit[tur]){ Bildirim.goster('uyari','Seçim Yok','Düzenlemek için aşağıdaki listeden bir kayıt seçin.'); return; }
    Bildirim.goster('bilgi','Düzenleme Modu','Kaydı değiştirip Kaydet butonuna basın.',2200);
  },
  sil(tur){
    const id = this.aktifKayit[tur];
    if(!id){ Bildirim.goster('uyari','Seçim Yok','Silmek için aşağıdaki listeden bir kayıt seçin.'); return; }
    const taksitVar = Depo.veri.taksitler.some(t=>t.islemId===id);
    const mesaj = taksitVar
      ? 'Bu işleme bağlı taksit planı bulunmaktadır. İşlemi silerseniz gerçekleşmemiş taksitler de silinecektir. Devam etmek istiyor musunuz?'
      : 'Bu kaydı silmek istediğinize emin misiniz?';
    Modal.onay('Kayıt Sil', mesaj, async ()=>{
      const kayit = Depo.veri.islemler.find(x=>x.id===id);
      if(kayit && kayit.dosyaId) await DosyaDepo.sil(kayit.dosyaId);
      Depo.veri.islemler = Depo.veri.islemler.filter(x=>x.id!==id);
      Depo.veri.hareketler = Depo.veri.hareketler.filter(h=>h.islemId!==id);
      Depo.veri.taksitler = Depo.veri.taksitler.filter(t=>t.islemId!==id);
      Depo.veri.taksitPlanlari = Depo.veri.taksitPlanlari.filter(p=>p.islemId!==id);
      Depo.kaydet();
      this.aktifKayit[tur]=null;
      Bildirim.goster('basari','Silindi','Kayıt başarıyla silindi.');
      App.sayfaGit('islemler');
    }, 'Evet, Sil', true);
  },

  // İşlem listesini forma yükle
  yukle(tur, id){

    if(!is) return;
    this.aktifKayit[tur]=id;
    this.bekleyenDosya = null;

      document.getElementById(on+'-tutar').value = is.tutar;

      document.getElementById('bk-sahis').value = is.sahisHesapId||'';
      document.getElementById('bk-tur').value = is.islemTuru||'giris';
      document.getElementById('bk-gider').value = is.giderHesapId||'';
      document.getElementById('bk-tutar').value = is.tutar;
      document.getElementById('bk-aciklama').value = is.aciklama||'';
      document.getElementById('bk-bankaac').value = is.bankaAciklama||'';

      document.getElementById('kk-sahis').value = is.sahisHesapId||'';
      document.getElementById('kk-gider').value = is.giderHesapId||'';
      document.getElementById('kk-tutar').value = is.tutar;
      document.getElementById('kk-odemetipi').value = is.odemeTipi||'tek';

      document.getElementById('kk-aciklama').value = is.aciklama||'';
      document.getElementById('kk-not').value = is.ekNot||'';
      this.kartOdemeTipi();
      if(is.dosyaMeta){ this.bekleyenDosya=null; this.mevcutDosyaGoster(is); }
      this.taksitOnizle();
    }
    this.listeVurgu(tur, id);
    Bildirim.goster('bilgi','Kayıt Yüklendi', is.no + ' düzenlemeye hazır.',1800);
    document.getElementById('sekme-icerik').scrollIntoView({behavior:'smooth',block:'start'});
  },

  mevcutDosyaGoster(is){
    const bilgi = document.getElementById('dosya-bilgi');
    const butonlar = document.getElementById('dosya-butonlar');
    if(bilgi && is.dosyaMeta){
      bilgi.innerHTML = `<span class="dosya-adi">📎 ${Yardimci.kacisHTML(is.dosyaMeta.ad)}</span> <span style="color:var(--metin-soluk)">(${Yardimci.boyutFormat(is.dosyaMeta.boyut)})</span>`;
      if(butonlar){
        butonlar.style.display='flex';
        butonlar.innerHTML = `

      satirlar = kayitlar.map(k=>{const h=Hesap.altBul(k.hesapId);return [k.no,Yardimci.tarihFormat(k.tarih),h?h.kod+' '+Hesap.hesapAdi(h):'',k.faturaNo,k.aciklama,Yardimci.sayiFormat(k.tutar),k.durum];});
    }else{
      bas = ['İşlem No','Tarih','Hesap','İşlem Adı','Şahıs','Tür','Tutar'];
      satirlar = kayitlar.map(k=>{const h=Hesap.altBul(k.hesapId);return [k.no,Yardimci.tarihFormat(k.tarih),h?h.kod+' '+Hesap.hesapAdi(h):'',k.islemAd,k.sahis,k.islemTuru==='giris'?'Para Girişi':'Para Çıkışı',Yardimci.sayiFormat(k.tutar)];});

  ekleModal(anaKod){
    this.duzenlenenId = null;
    const ana = Hesap.anaBul(anaKod);
    const yeniKod = Depo.veri.anaHesaplar.length ? (anaKod + '.' + String((Depo.veri.sayaclar.altKod[anaKod]||0)+1).padStart(2,'0')) : '';
    this.formGoster(ana.tur, anaKod, yeniKod, null, `${anaKod} ${ana.ad} - Yeni Alt Hesap`);
  },

  duzenleModal(id){
    const h = Hesap.altBul(id);
    if(!h) return;
    this.duzenlenenId = id;
    const ana = Hesap.anaBul(h.anaKod);
    this.formGoster(h.tur, h.anaKod, h.kod, h, `${h.kod} - Alt Hesap Düzenle`);
  },

  formGoster(tur, anaKod, kod, veri, baslik){
    const alanlar = this.alanTanim(tur);
    let govde = `<div class="form-grid">
      <div class="form-alan"><label>Hesap Kodu</label><input id="ah-kod" value="${kod}" readonly></div>`;
    alanlar.forEach(a=>{
      const deger = veri ? (veri[a.id]!==undefined?veri[a.id]:'') : '';
      const zorunlu = a.zorunlu?' <span class="zorunlu">*</span>':'';
      if(a.tam){
        govde += `<div class="form-alan tam"><label>${a.ad}${zorunlu}</label><textarea id="ah-${a.id}">${Yardimci.kacisHTML(deger)}</textarea></div>`;
      }else if(a.para){
        govde += `<div class="form-alan"><label>${a.ad}${zorunlu}</label><input type="number" min="0" step="0.01" id="ah-${a.id}" value="${deger||''}" placeholder="0,00"></div>`;
      }else if(a.gun){
        govde += `<div class="form-alan"><label>${a.ad}${zorunlu}</label><input type="number" min="1" max="31" id="ah-${a.id}" value="${deger||''}"></div>`;
      }else if(a.dort){
        govde += `<div class="form-alan"><label>${a.ad}${zorunlu}</label><input maxlength="4" id="ah-${a.id}" value="${Yardimci.kacisHTML(deger)}" placeholder="1234"></div>`;
      }else{
        govde += `<div class="form-alan"><label>${a.ad}${zorunlu}</label><input id="ah-${a.id}" value="${Yardimci.kacisHTML(deger)}"></div>`;
      }
    });
    govde += `</div>`;
    const alt = `<button class="btn btn-gri" onclick="Modal.kapat()">Vazgeç</button>
      <button class="btn btn-kirmizi" onclick="AltHesap.kaydet('${tur}','${anaKod}','${kod}')">💾 Kaydet</button>`;
    Modal.ac(baslik, govde, alt, true);
  },

  kaydet(tur, anaKod, kod){
    const alanlar = this.alanTanim(tur);
    const kayit = {};
    for(const a of alanlar){
      const el = document.getElementById('ah-'+a.id);
      let deger = el ? el.value.trim() : '';
      if(a.zorunlu && !deger){ Bildirim.goster('hata','Eksik Alan', a.ad + ' zorunludur.'); el.focus(); return; }
      if(a.iban && deger && !Yardimci.ibanGecerli(deger)){ Bildirim.goster('hata','Geçersiz IBAN','IBAN "TR" ile başlamalı ve 26 karakter olmalıdır.'); el.focus(); return; }
      if(a.dort && deger && !/^\d{4}$/.test(deger)){ Bildirim.goster('hata','Geçersiz Değer','Kartın son dört hanesi sadece 4 rakam olmalıdır.'); el.focus(); return; }
      if(a.para){ deger = Yardimci.paraCoz(deger); if(deger<0){ Bildirim.goster('hata','Geçersiz Tutar','Negatif tutar girilemez.'); el.focus(); return; } }
      if(a.gun && deger){ const g=parseInt(deger); if(g<1||g>31){ Bildirim.goster('hata','Geçersiz Gün','Gün 1-31 arasında olmalıdır.'); el.focus(); return; } }
      if(a.iban && deger) deger = Yardimci.ibanDuzenle(deger);
      kayit[a.id] = deger;
    }

    // Aynı isim kontrolü
    const isim = kayit.ad;
    const cakisma = Depo.veri.altHesaplar.find(h=>h.anaKod===anaKod && h.id!==this.duzenlenenId && (h.ad||'').toLocaleLowerCase('tr')===isim.toLocaleLowerCase('tr'));
    if(cakisma){ Bildirim.goster('uyari','Tekrar Eden İsim','Bu ana hesap altında aynı isimde bir hesap zaten mevcut.'); return; }

    if(this.duzenlenenId){
      const i = Depo.veri.altHesaplar.findIndex(h=>h.id===this.duzenlenenId);
      Depo.veri.altHesaplar[i] = Object.assign({}, Depo.veri.altHesaplar[i], kayit);
      Bildirim.goster('basari','Güncellendi','Alt hesap başarıyla güncellendi.');
    }else{
      const yeniKod = Depo.yeniAltKod(anaKod);
      Depo.veri.altHesaplar.push(Object.assign({
        id: Yardimci.yeniId(), kod: yeniKod, anaKod: anaKod, tur: tur
      }, kayit));
      Bildirim.goster('basari','Oluşturuldu','Yeni alt hesap (' + yeniKod + ') başarıyla oluşturuldu.');
    }
    Depo.kaydet();
    Modal.kapat();
    App.sayfaGit('hesaplar');
  },

  sil(id){
    const h = Hesap.altBul(id);
    if(!h) return;
    const hareketVar = Depo.veri.hareketler.some(x=>x.hesapId===id);
    const mesaj = hareketVar
      ? 'Bu hesaba ait işlem hareketleri bulunuyor. Hesabı silerseniz bağlı hareketler de silinecektir. Devam edilsin mi?'
      : 'Bu alt hesabı silmek istediğinize emin misiniz?';
    Modal.onay('Alt Hesap Sil', mesaj, ()=>{
      // Bağlı işlemleri ve hareketleri sil
      const silinenIslemIds = Depo.veri.hareketler.filter(x=>x.hesapId===id).map(x=>x.islemId);
      Depo.veri.hareketler = Depo.veri.hareketler.filter(x=>x.hesapId!==id);
      Depo.veri.islemler = Depo.veri.islemler.filter(x=>!(x.hesapId===id));
      Depo.veri.altHesaplar = Depo.veri.altHesaplar.filter(x=>x.id!==id);
      // Not: hesap kodu sayacı geri alınmaz (kod tekrar kullanılmaz)
      Depo.kaydet();
      Bildirim.goster('basari','Silindi','Alt hesap silindi. (Hesap kodu tekrar kullanılmayacak)');
      App.sayfaGit('hesaplar');
    }, 'Evet, Sil', true);
  }
};
