    const bas = document.getElementById('har-bas').value;
    const bit = document.getElementById('har-bit').value;
    this.hareketTablo(h, q, bas, bit);
  },

  hareketTablo(h, aranan, bas, bit){
    let hareketler = Hesap.hareketler(h.id);
    const q = (aranan||'').toLocaleLowerCase('tr');
    if(q) hareketler = hareketler.filter(x=>((x.islemNo||'')+' '+(x.aciklama||'')).toLocaleLowerCase('tr').indexOf(q)>-1);
    if(bas) hareketler = hareketler.filter(x=>x.tarih>=bas);
    if(bit) hareketler = hareketler.filter(x=>x.tarih<=bit);

    const el = document.getElementById('hareket-tablo');
    if(hareketler.length===0){
      el.innerHTML = `<div class="bos-mesaj">Bu hesaba ait hareket bulunmuyor.</div>`;
      return;
    }
    if(h.tur==='alici' || h.tur==='satici') el.innerHTML = this.tabloCari(h, hareketler);
    else el.innerHTML = this.tabloBankaKart(h, hareketler);
  },

  // Banka & Kredi kartı hareket tablosu
  tabloBankaKart(h, hareketler){
    const satir = hareketler.map(x=>{
      const is = Depo.veri.islemler.find(i=>i.id===x.islemId) || {};
      const gider = is.giderHesapId ? Hesap.altBul(is.giderHesapId) : null;
      const etkiRenk = x.etki>=0 ? 'borc' : 'alacak';
      const etkiYazi = (x.etki>=0?'+':'') + Yardimci.paraFormat(x.etki);
      return `<tr>
        <td><span class="kod-rozet">${x.islemNo}</span></td>
        <td>${Yardimci.tarihFormat(x.tarih)}</td>
        <td>${Yardimci.kacisHTML(is.islemAd||'')}</td>
        <td>${Yardimci.kacisHTML(is.sahis||'')}</td>
        <td>${Yardimci.kacisHTML(is.aciklama||'')}</td>
        <td>${Yardimci.kacisHTML(is.bankaAciklama||'')}</td>
        <td>${gider?Yardimci.kacisHTML(gider.kod+' '+Hesap.hesapAdi(gider)):'-'}</td>
        <td class="sag-hiza borc">${x.borc?Yardimci.paraFormat(x.borc):'-'}</td>
        <td class="sag-hiza alacak">${x.alacak?Yardimci.paraFormat(x.alacak):'-'}</td>
        <td class="sag-hiza ${etkiRenk}">${etkiYazi}</td>
        <td class="sag-hiza"><b>${Yardimci.paraFormat(x.guncelBakiye)}</b></td>
        <td class="no-print satir-ic">
          <button class="btn btn-cizgi btn-kucuk" onclick="Detay.islemDuzenle('${x.islemId}')">✎</button>
          <button class="btn btn-cizgi btn-kucuk" onclick="Detay.islemSil('${x.islemId}','${h.id}')">🗑</button>
        </td>
      </tr>`;
    }).join('');
    return `<div class="tablo-sar"><table class="veri"><thead><tr>
      <th>İşlem No</th><th>Tarih</th><th>İşlem Adı</th><th>Şahıs</th><th>Açıklama</th><th>Banka Açıklaması</th><th>Gider Hesabı</th>
      <th class="sag-hiza">Borç</th><th class="sag-hiza">Alacak</th><th class="sag-hiza">Bakiye</th><th class="sag-hiza">Güncel Bakiye</th><th class="no-print">İşlemler</th>
    </tr></thead><tbody>${satir}</tbody></table></div>`;
  },

  // Alıcı & Satıcı (cari) hareket tablosu
  tabloCari(h, hareketler){
    const satir = hareketler.map(x=>{
      const is = Depo.veri.islemler.find(i=>i.id===x.islemId) || {};
      const faturaTur = is.tur==='satis'?'Satış Faturası':(is.tur==='alis'?'Alış Faturası':'-');
      const etkiRenk = x.etki>=0 ? 'borc' : 'alacak';
      const etkiYazi = (x.etki>=0?'+':'') + Yardimci.paraFormat(x.etki);
      let faturaHtml = '-';
      if(is.tur==='alis'||is.tur==='satis'){
        faturaHtml = faturaTur;
        if(is.dosyaMeta){
          faturaHtml += ` <button class="btn btn-cizgi btn-kucuk no-print" onclick="DosyaGoster.islemDosya('${is.id}','goster')">👁</button>
            <button class="btn btn-cizgi btn-kucuk no-print" onclick="DosyaGoster.islemDosya('${is.id}','indir')">⬇</button>`;
        }
      }
      return `<tr>
        <td><span class="kod-rozet">${x.islemNo}</span></td>
        <td>${Yardimci.tarihFormat(x.tarih)}</td>
        <td>${Yardimci.kacisHTML(x.aciklama||'')}</td>
        <td class="sag-hiza borc">${x.borc?Yardimci.paraFormat(x.borc):'-'}</td>
        <td class="sag-hiza alacak">${x.alacak?Yardimci.paraFormat(x.alacak):'-'}</td>
        <td class="sag-hiza ${etkiRenk}">${etkiYazi}</td>
        <td class="sag-hiza"><b>${Yardimci.paraFormat(x.guncelBakiye)}</b></td>
        <td>${faturaHtml}</td>
        <td>${Yardimci.kacisHTML(is.faturaNo||'-')}</td>
        <td class="no-print satir-ic">
          <button class="btn btn-cizgi btn-kucuk" onclick="Detay.islemDuzenle('${x.islemId}')">✎</button>
          <button class="btn btn-cizgi btn-kucuk" onclick="Detay.islemSil('${x.islemId}','${h.id}')">🗑</button>
        </td>
      </tr>`;
    }).join('');
    return `<div class="tablo-sar"><table class="veri"><thead><tr>
      <th>İşlem No</th><th>Tarih</th><th>Açıklama</th><th class="sag-hiza">Borç</th><th class="sag-hiza">Alacak</th>
      <th class="sag-hiza">Bakiye</th><th class="sag-hiza">Güncel Bakiye</th><th>Fatura</th><th>Fatura No</th><th class="no-print">İşlemler</th>
    </tr></thead><tbody>${satir}</tbody></table></div>`;
  },

  yeniIslem(hesapId){
    const h = Hesap.altBul(hesapId);
    // İlgili işlem sekmesine yönlendir
    const eslesme = {banka:'banka', kart:'kart', alici:'satis', satici:'alis'};
    App.aktifSekme = eslesme[h.tur]||'banka';
    App.sayfaGit('islemler');
    setTimeout(()=>{
      const on = {banka:'bk', kart:'kk', satis:'sa', alis:'al'}[App.aktifSekme];
      const sel = document.getElementById(on+'-hesap');
      if(sel){ sel.value = hesapId; }
    },100);
    Bildirim.goster('bilgi','Yeni İşlem', h.kod + ' için işlem giriş formu açıldı.',2200);
  },

  islemDuzenle(islemId){
    const is = Depo.veri.islemler.find(x=>x.id===islemId);
    if(!is) return;
    App.aktifSekme = is.tur;
    App.sayfaGit('islemler');
    setTimeout(()=>Form.yukle(is.tur, islemId), 120);
  },

  islemSil(islemId, hesapId){
    Modal.onay('İşlem Sil','Bu kaydı silmek istediğinize emin misiniz?', async ()=>{
      const kayit = Depo.veri.islemler.find(x=>x.id===islemId);
      if(kayit && kayit.dosyaId) await DosyaDepo.sil(kayit.dosyaId);
      Depo.veri.islemler = Depo.veri.islemler.filter(x=>x.id!==islemId);
      Depo.veri.hareketler = Depo.veri.hareketler.filter(h=>h.islemId!==islemId);
      Depo.veri.taksitler = Depo.veri.taksitler.filter(t=>t.islemId!==islemId);
      Depo.veri.taksitPlanlari = Depo.veri.taksitPlanlari.filter(p=>p.islemId!==islemId);
      Depo.kaydet();
      Bildirim.goster('basari','Silindi','İşlem başarıyla silindi.');
      Detay.ac(hesapId);
    }, 'Evet, Sil', true);
  },

  yazdir(hesapId){
    const h = Hesap.altBul(hesapId);
    const hareketler = Hesap.hareketler(hesapId);
    const netB = Hesap.netBakiye(hesapId);
    let bas, satirlar;
    if(h.tur==='alici'||h.tur==='satici'){
      bas = ['İşlem No','Tarih','Açıklama','Borç','Alacak','Güncel Bakiye','Fatura No'];
      satirlar = hareketler.map(x=>{const is=Depo.veri.islemler.find(i=>i.id===x.islemId)||{};return [x.islemNo,Yardimci.tarihFormat(x.tarih),x.aciklama,x.borc?Yardimci.paraFormat(x.borc):'',x.alacak?Yardimci.paraFormat(x.alacak):'',Yardimci.paraFormat(x.guncelBakiye),is.faturaNo||''];});
    }else{
      bas = ['İşlem No','Tarih','İşlem Adı','Şahıs','Borç','Alacak','Güncel Bakiye'];
      satirlar = hareketler.map(x=>{const is=Depo.veri.islemler.find(i=>i.id===x.islemId)||{};return [x.islemNo,Yardimci.tarihFormat(x.tarih),is.islemAd||'',is.sahis||'',x.borc?Yardimci.paraFormat(x.borc):'',x.alacak?Yardimci.paraFormat(x.alacak):'',Yardimci.paraFormat(x.guncelBakiye)];});
    }
    const ust = `<p style="margin-bottom:10px"><b>Hesap:</b> ${h.kod} - ${Yardimci.kacisHTML(Hesap.hesapAdi(h))} &nbsp;|&nbsp; <b>Güncel Bakiye:</b> ${Yardimci.paraFormat(netB)}</p>`;
    Disari.yazdir('Hesap Ekstresi', ust + Disari.tabloHTML(bas, satirlar));
  },

  excel(hesapId){
    const h = Hesap.altBul(hesapId);
    const hareketler = Hesap.hareketler(hesapId);
    let bas, satirlar;
    if(h.tur==='alici'||h.tur==='satici'){
      bas = ['İşlem No','Tarih','Açıklama','Borç','Alacak','Bakiye','Güncel Bakiye','Fatura No'];
      satirlar = hareketler.map(x=>{const is=Depo.veri.islemler.find(i=>i.id===x.islemId)||{};return [x.islemNo,Yardimci.tarihFormat(x.tarih),x.aciklama,Yardimci.sayiFormat(x.borc),Yardimci.sayiFormat(x.alacak),Yardimci.sayiFormat(x.etki),Yardimci.sayiFormat(x.guncelBakiye),is.faturaNo||''];});
    }else{
      bas = ['İşlem No','Tarih','İşlem Adı','Şahıs','Açıklama','Banka Açıklaması','Borç','Alacak','Bakiye','Güncel Bakiye'];
      satirlar = hareketler.map(x=>{const is=Depo.veri.islemler.find(i=>i.id===x.islemId)||{};return [x.islemNo,Yardimci.tarihFormat(x.tarih),is.islemAd||'',is.sahis||'',is.aciklama||'',is.bankaAciklama||'',Yardimci.sayiFormat(x.borc),Yardimci.sayiFormat(x.alacak),Yardimci.sayiFormat(x.etki),Yardimci.sayiFormat(x.guncelBakiye)];});
    }
    Disari.csv(bas, satirlar, h.kod + '-ekstre');
  }
};

/* ==================================================================
   Bölüm 11: Dosya Görüntüleme / İndirme
   ================================================================== */
const DosyaGoster = {
  goster(dosya){
    const veri = dosya.data;
    const isPdf = (dosya.tur && dosya.tur.indexOf('pdf')>-1) || /\.pdf$/i.test(dosya.ad);
    let ic;
    if(isPdf){
      ic = `<iframe src="${veri}" style="width:100%;height:70vh;border:none;border-radius:8px"></iframe>`;
    }else{
      ic = `<img src="${veri}" style="max-width:100%;border-radius:8px;display:block;margin:0 auto">`;
    }
    const alt = `<button class="btn btn-gri" onclick="Modal.kapat()">Kapat</button>`;
    Modal.ac('📎 ' + dosya.ad, ic, alt, true);
  },
  indir(dosya){
    const a = document.createElement('a');
    a.href = dosya.data; a.download = dosya.ad; a.click();
  },
  async islemDosya(islemId, eylem){
    const is = Depo.veri.islemler.find(x=>x.id===islemId);
    if(!is || !is.dosyaId){ Bildirim.goster('uyari','Dosya Yok','Bu işleme ait dosya bulunamadı.'); return; }
    const dosya = await DosyaDepo.getir(is.dosyaId);
    if(!dosya){ Bildirim.goster('hata','Dosya Bulunamadı','Dosya deposunda kayıt yok.'); return; }
    if(eylem==='goster') this.goster(dosya);
    else this.indir(dosya);
  }
};

/* ==================================================================
   Bölüm 12: Raporlar
   ================================================================== */
const Rapor = {
  sonRapor:null,

  hesapListesiDoldur(){
    const turSel = document.getElementById('rf-tur');
    const hesapSel = document.getElementById('rf-hesap');
    if(!turSel||!hesapSel) return;
    const guncelle = ()=>{
      const tur = turSel.value;
      let opts = '<option value="">Tümü</option>';
      Depo.veri.altHesaplar.filter(h=>!tur||h.tur===tur).forEach(h=>{
        opts += `<option value="${h.id}">${h.kod} - ${Yardimci.kacisHTML(Hesap.hesapAdi(h))}</option>`;
      });
      hesapSel.innerHTML = opts;
    };
    turSel.addEventListener('change', guncelle);
    guncelle();
  },

  filtreOku(){
    return {
      bas: document.getElementById('rf-bas').value,
      bit: document.getElementById('rf-bit').value,
      tur: document.getElementById('rf-tur').value,
      hesap: document.getElementById('rf-hesap').value,
      islem: document.getElementById('rf-islem').value,
      min: document.getElementById('rf-min').value?Yardimci.paraCoz(document.getElementById('rf-min').value):null,
      max: document.getElementById('rf-max').value?Yardimci.paraCoz(document.getElementById('rf-max').value):null
    };
  },

  temizle(){
    ['rf-bas','rf-bit','rf-hesap','rf-islem','rf-min','rf-max'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
    document.getElementById('rf-tur').value='';
    this.hesapListesiDoldur();
    document.getElementById('rapor-sonuc').innerHTML = `<div class="bos-mesaj">Bir rapor türü seçip "Raporu Getir" butonuna basın.</div>`;
    this.sonRapor=null;
  },

  getir(){
    if(!App.aktifRapor){ Bildirim.goster('uyari','Rapor Seçilmedi','Lütfen bir rapor türü seçin.'); return; }
    const f = this.filtreOku();
    let sonuc;
    switch(App.aktifRapor){
      case 'banka': sonuc = this.bakiyeRapor('banka','Banka Bakiye Raporu'); break;
      case 'alici': sonuc = this.bakiyeRapor('alici','Alıcı Bakiye Raporu'); break;
      case 'satici': sonuc = this.bakiyeRapor('satici','Satıcı Bakiye Raporu'); break;
      case 'kart': sonuc = this.kartRapor(); break;
      case 'tarih': sonuc = this.islemRapor(f, 'Tarih Aralığına Göre İşlemler'); break;
      case 'borcalacak': sonuc = this.borcAlacakRapor(f); break;
      case 'fatura': sonuc = this.faturaRapor(f); break;
    }
    const el = document.getElementById('rapor-sonuc');
    if(!sonuc || sonuc.satirlar.length===0){
      el.innerHTML = `<div class="bos-mesaj">Seçilen kriterlere uygun kayıt bulunamadı.</div>`;
      this.sonRapor = null;
      return;
    }
    this.sonRapor = sonuc;
    el.innerHTML = `<h2 class="bolum-baslik">${sonuc.baslik}</h2>
      <div class="tablo-sar"><table class="veri"><thead><tr>${sonuc.basliklar.map(b=>`<th${b.sag?' class="sag-hiza"':''}>${b.ad||b}</th>`).join('')}</tr></thead>
      <tbody>${sonuc.satirlar.map(r=>`<tr>${r.map((c,i)=>`<td${sonuc.basliklar[i]&&sonuc.basliklar[i].sag?' class="sag-hiza"':''}>${Yardimci.kacisHTML(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  },

  bakiyeRapor(tur, baslik){
    const basliklar = [{ad:'Hesap Kodu'},{ad:'Hesap Adı'},{ad:'Toplam Borç',sag:true},{ad:'Toplam Alacak',sag:true},{ad:'Güncel Bakiye',sag:true}];
    const satirlar = Depo.veri.altHesaplar.filter(h=>h.tur===tur).map(h=>{
      const {tBorc,tAlacak} = Hesap.toplamlar(h.id);
      return [h.kod, Hesap.hesapAdi(h), Yardimci.paraFormat(tBorc), Yardimci.paraFormat(tAlacak), Yardimci.paraFormat(Hesap.netBakiye(h.id))];
    });
    return {baslik, basliklar, satirlar};
  },

  kartRapor(){
    const basliklar = [{ad:'Hesap Kodu'},{ad:'Kart Adı'},{ad:'Kart Limiti',sag:true},{ad:'Güncel Borç',sag:true},{ad:'Kullanılabilir Limit',sag:true}];
    const satirlar = Depo.veri.altHesaplar.filter(h=>h.tur==='kart').map(h=>{
      const borc = Hesap.kartBorc(h.id);
      const limit = Number(h.limit)||0;
      return [h.kod, Hesap.hesapAdi(h), Yardimci.paraFormat(limit), Yardimci.paraFormat(borc), Yardimci.paraFormat(limit-borc)];
    });
    return {baslik:'Kredi Kartı Bakiye Raporu', basliklar, satirlar};
  },

  islemRapor(f, baslik){
    const basliklar = [{ad:'İşlem No'},{ad:'Tarih'},{ad:'Tür'},{ad:'Hesap'},{ad:'Açıklama'},{ad:'Borç',sag:true},{ad:'Alacak',sag:true}];
    let hareketler = this.hareketFiltre(f);
    const satirlar = hareketler.map(x=>{
      const h = Hesap.altBul(x.hesapId);
      const is = Depo.veri.islemler.find(i=>i.id===x.islemId)||{};
      return [x.islemNo, Yardimci.tarihFormat(x.tarih), Sayfa.islemTurAdi(is.tur), h?h.kod+' '+Hesap.hesapAdi(h):'', x.aciklama, x.borc?Yardimci.paraFormat(x.borc):'', x.alacak?Yardimci.paraFormat(x.alacak):''];
    });
    return {baslik, basliklar, satirlar};
  },

  borcAlacakRapor(f){
    const basliklar = [{ad:'İşlem No'},{ad:'Tarih'},{ad:'Hesap'},{ad:'Açıklama'},{ad:'Borç',sag:true},{ad:'Alacak',sag:true}];
    let hareketler = this.hareketFiltre(f);
    let tB=0,tA=0;
    const satirlar = hareketler.map(x=>{
      const h = Hesap.altBul(x.hesapId);
      tB+=Number(x.borc)||0; tA+=Number(x.alacak)||0;
      return [x.islemNo, Yardimci.tarihFormat(x.tarih), h?h.kod+' '+Hesap.hesapAdi(h):'', x.aciklama, x.borc?Yardimci.paraFormat(x.borc):'', x.alacak?Yardimci.paraFormat(x.alacak):''];
    });
    if(satirlar.length) satirlar.push(['','','','TOPLAM', Yardimci.paraFormat(tB), Yardimci.paraFormat(tA)]);
    return {baslik:'Borç ve Alacak Raporu', basliklar, satirlar};
  },

  faturaRapor(f){
    const basliklar = [{ad:'İşlem No'},{ad:'Tarih'},{ad:'Tür'},{ad:'Hesap'},{ad:'Fatura No'},{ad:'Tutar',sag:true},{ad:'Durum'},{ad:'Dosya'}];
    let fat = Depo.veri.islemler.filter(x=>x.tur==='alis'||x.tur==='satis');
    if(f.bas) fat = fat.filter(x=>x.tarih>=f.bas);
    if(f.bit) fat = fat.filter(x=>x.tarih<=f.bit);
    if(f.tur==='alici') fat = fat.filter(x=>x.tur==='satis');
    if(f.tur==='satici') fat = fat.filter(x=>x.tur==='alis');
    if(f.hesap) fat = fat.filter(x=>x.hesapId===f.hesap);
    if(f.min!=null) fat = fat.filter(x=>x.tutar>=f.min);
    if(f.max!=null) fat = fat.filter(x=>x.tutar<=f.max);
    const durumAd = {odenmedi:'Ödenmedi/Tahsil Edilmedi',kismi:'Kısmi',odendi:'Ödendi/Tahsil Edildi'};
    const satirlar = fat.map(x=>{
      const h = Hesap.altBul(x.hesapId);
      return [x.no, Yardimci.tarihFormat(x.tarih), Sayfa.islemTurAdi(x.tur), h?h.kod+' '+Hesap.hesapAdi(h):'', x.faturaNo, Yardimci.paraFormat(x.tutar), durumAd[x.durum]||'', x.dosyaMeta?'Var':'Yok'];
    });
    return {baslik:'Fatura Raporu', basliklar, satirlar};
  },

  hareketFiltre(f){
    let hareketler = [...Depo.veri.hareketler];
    if(f.bas) hareketler = hareketler.filter(x=>x.tarih>=f.bas);
    if(f.bit) hareketler = hareketler.filter(x=>x.tarih<=f.bit);
    if(f.hesap) hareketler = hareketler.filter(x=>x.hesapId===f.hesap);
    if(f.tur){ const ids = Depo.veri.altHesaplar.filter(h=>h.tur===f.tur).map(h=>h.id); hareketler = hareketler.filter(x=>ids.includes(x.hesapId)); }
    if(f.islem==='borc') hareketler = hareketler.filter(x=>Number(x.borc)>0);
    if(f.islem==='alacak') hareketler = hareketler.filter(x=>Number(x.alacak)>0);
    if(f.min!=null) hareketler = hareketler.filter(x=>(Number(x.borc)||Number(x.alacak))>=f.min);
    if(f.max!=null) hareketler = hareketler.filter(x=>(Number(x.borc)||Number(x.alacak))<=f.max);
    hareketler.sort((a,b)=> a.tarih!==b.tarih ? a.tarih.localeCompare(b.tarih) : (a.islemNo||'').localeCompare(b.islemNo||''));
    return hareketler;
  },

  yazdir(){
    if(!this.sonRapor){ Bildirim.goster('uyari','Rapor Yok','Önce bir rapor getirin.'); return; }
    const s = this.sonRapor;
    Disari.yazdir(s.baslik, Disari.tabloHTML(s.basliklar.map(b=>b.ad||b), s.satirlar));
  },
  excel(){
    if(!this.sonRapor){ Bildirim.goster('uyari','Rapor Yok','Önce bir rapor getirin.'); return; }
    const s = this.sonRapor;
    Disari.csv(s.basliklar.map(b=>b.ad||b), s.satirlar, 'rapor');
  }
};

/* ==================================================================
   Bölüm 13: Ayarlar
   ================================================================== */
const Ayar = {
  logoGecici:null,
  logoYukle(e){
    const dosya = e.target.files[0];
    if(!dosya) return;
    if(dosya.size > 1024*1024){ Bildirim.goster('uyari','Logo Büyük','Logo dosyası 1 MB altında olmalıdır.'); return; }
    const okuyucu = new FileReader();
    okuyucu.onload = ()=>{
      this.logoGecici = okuyucu.result;
      document.getElementById('logo-onizle').innerHTML = `<img src="${okuyucu.result}" style="height:46px;border-radius:8px">`;
      Bildirim.goster('bilgi','Logo Seçildi','Kaydetmek için "Ayarları Kaydet" butonuna basın.',2200);
    };
    okuyucu.readAsDataURL(dosya);
  },
  kaydet(){
    const f = Depo.veri.firma;
    f.ad = document.getElementById('f-ad').value.trim();
    f.yetkili = document.getElementById('f-yetkili').value.trim();
    f.telefon = document.getElementById('f-telefon').value.trim();
    f.eposta = document.getElementById('f-eposta').value.trim();
    f.vergiDairesi = document.getElementById('f-vd').value.trim();
    f.vergiNo = document.getElementById('f-vno').value.trim();
    f.adres = document.getElementById('f-adres').value.trim();
    if(this.logoGecici) f.logo = this.logoGecici;

    const a = Depo.veri.ayarlar;
    a.varsayilanTarih = document.getElementById('a-tarih').value;
    a.ondalik = parseInt(document.getElementById('a-ondalik').value);
    a.tema = document.getElementById('a-tema').value;
    a.islemBaslangic = parseInt(document.getElementById('a-baslangic').value)||1;

    Depo.kaydet();
    App.temaUygula();
    App.firmaGuncelle();
    this.logoGecici = null;
    Bildirim.goster('basari','Kaydedildi','Ayarlar başarıyla kaydedildi.');
  }
};

/* ==================================================================
   Bölüm 14: Yedekleme
   ================================================================== */
const Yedek = {
  async al(){
    const veri = JSON.parse(JSON.stringify(Depo.veri));
    // dosyaları da ekle
    let dosyalar = [];
    try{ dosyalar = await DosyaDepo.hepsi(); }catch(e){}
    const paket = { uygulama:'Nizam Soft Ön Muhasebe', tarih:Yardimci.bugun(), veri, dosyalar };
    const blob = new Blob([JSON.stringify(paket,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'nizam-soft-yedek-' + Yardimci.dosyaTarih() + '.json';
    a.click();
    URL.revokeObjectURL(url);
    Bildirim.goster('basari','Yedek Alındı','JSON yedek dosyası indirildi.');
  },

  geriYukle(e){
    const dosya = e.target.files[0];
    if(!dosya) return;
    const okuyucu = new FileReader();
    okuyucu.onload = ()=>{
      let paket;
      try{ paket = JSON.parse(okuyucu.result); }
      catch(err){ Bildirim.goster('hata','Geçersiz Dosya','JSON dosyası okunamadı.'); return; }
      if(!paket.veri || !paket.veri.anaHesaplar){ Bildirim.goster('hata','Geçersiz Yedek','Bu dosya geçerli bir yedek değil.'); return; }
      Modal.onay('Yedeği Geri Yükle',
        'Mevcut tüm veriler bu yedek ile değiştirilecektir. Bu işlem geri alınamaz. Devam etmek istiyor musunuz?',
        async ()=>{
          Depo.veri = paket.veri;
          Depo.butunle();
          Depo.kaydet();
          // dosyaları geri yükle
          if(paket.dosyalar && paket.dosyalar.length){
            await DosyaDepo.temizle();
            for(const d of paket.dosyalar){ await DosyaDepo.kaydet(d); }
          }
          App.temaUygula();
          App.firmaGuncelle();
          Bildirim.goster('basari','Geri Yüklendi','Yedek başarıyla geri yüklendi.');
          App.sayfaGit('anasayfa');
        }, 'Evet, Geri Yükle', true);
    };
    okuyucu.readAsText(dosya);
    e.target.value='';
  },

  temizleUyari(){
    Modal.onay('⚠ TÜM VERİLERİ TEMİZLE',
      'DİKKAT! Bütün firma bilgileri, hesaplar, işlemler ve fatura dosyaları KALICI olarak silinecektir. Bu işlem geri alınamaz!',
      ()=>this.temizleIkinci(), 'Devam Et', true);
  },
  temizleIkinci(){
    Modal.onay('Son Onay',
      'Bu işlem GERİ ALINAMAZ. Tüm verilerin silinmesini gerçekten onaylıyor musunuz?',
      async ()=>{
        await DosyaDepo.temizle();
        localStorage.removeItem(Depo.ANAHTAR);
        Depo.veri = Depo.varsayilan(); // ana hesaplar otomatik yeniden oluşur
        Depo.kaydet();
        App.temaUygula();
        App.firmaGuncelle();
        Bildirim.goster('basari','Temizlendi','Tüm veriler silindi. Ana hesaplar yeniden oluşturuldu.');
        App.sayfaGit('anasayfa');
      }, 'EVET, HEPSİNİ SİL', true);
  }
};

/* ==================================================================
   Bölüm 14b: Dönem Sonu (KDV Mahsubu + Kâr/Zarar Kapanışı)
   ================================================================== */
const Donem = {
  // Bir hesabın belirli tarihe kadarki net bakiyesi (borç - alacak, açılış dahil)
  tarihliBakiye(hesapId, tarih){
    const hesap = Hesap.altBul(hesapId);
    let toplam = Hesap.acilisBakiye(hesap);
    Depo.veri.hareketler
      .filter(h=>h.hesapId===hesapId && (!tarih || h.tarih<=tarih))
      .forEach(h=>{ toplam += (Number(h.borc)||0) - (Number(h.alacak)||0); });
    return toplam;
  },

  // Basit hareket kaydı üret (dönem fişleri için)
  har(islem, hesapId, borc, alacak, aciklama){
    return { id:Yardimci.yeniId(), islemId:islem.id, islemNo:islem.no, hesapId:hesapId,
             tarih:islem.tarih, aciklama:aciklama, borc:Number(borc)||0, alacak:Number(alacak)||0 };
  },

  /* ---- KDV MAHSUBU ---- */
  kdvOzet(tarih){
    const id391 = Hesap.sistemId('391'), id191 = Hesap.sistemId('191');
    const hesaplanan = -this.tarihliBakiye(id391, tarih); // 391 alacak nitelikli
    const indirilecek = this.tarihliBakiye(id191, tarih);  // 191 borç nitelikli
    const fark = hesaplanan - indirilecek;
    return { hesaplanan, indirilecek, fark, id391, id191 };
  },

  kdvHesaplaGoster(){
    const tarih = document.getElementById('kdv-tarih').value;
    if(!tarih){ Bildirim.goster('hata','Eksik Tarih','Dönem sonu tarihi seçin.'); return; }
    const o = this.kdvOzet(tarih);
    const sonuc = o.fark>0.005 ? `<b style="color:var(--kirmizi)">Ödenecek KDV: ${Yardimci.paraFormat(o.fark)}</b>`
                : o.fark<-0.005 ? `<b style="color:var(--yesil)">Sonraki Döneme Devreden KDV: ${Yardimci.paraFormat(-o.fark)}</b>`
                : `<b>KDV farkı yok (0,00 TL)</b>`;
    document.getElementById('kdv-sonuc').innerHTML = `
      <div class="etiket-satir"><span>Hesaplanan KDV (391)</span><b>${Yardimci.paraFormat(o.hesaplanan)}</b></div>
      <div class="etiket-satir"><span>İndirilecek KDV (191)</span><b>${Yardimci.paraFormat(o.indirilecek)}</b></div>
      <div class="etiket-satir"><span>Fark</span>${sonuc}</div>`;
  },

  kdvMahsupOlustur(){
    const tarih = document.getElementById('kdv-tarih').value;
    if(!tarih){ Bildirim.goster('hata','Eksik Tarih','Dönem sonu tarihi seçin.'); return; }
    const donemAd = document.getElementById('kdv-donem').value.trim();
    const o = this.kdvOzet(tarih);
    if(Math.abs(o.hesaplanan)<0.005 && Math.abs(o.indirilecek)<0.005){
      Bildirim.goster('uyari','Kayıt Yok','Bu tarihe kadar mahsup edilecek KDV bulunmuyor.'); return;
    }
    Modal.onay('KDV Mahsup Fişi','Belirtilen tarihe kadarki Hesaplanan ve İndirilecek KDV kapatılıp mahsup fişi oluşturulacak. Onaylıyor musunuz?', ()=>{
      const islem = { id:Yardimci.yeniId(), no:Depo.yeniIslemNo(), tur:'kdvmahsup', tarih:tarih,
        hesapId:o.id391, islemAd:'KDV Mahsubu'+(donemAd?' ('+donemAd+')':''), donemAd:donemAd, tutar:o.fark };
      const har = [];
      if(o.hesaplanan>0.005) har.push(this.har(islem, o.id391, o.hesaplanan, 0, 'Hesaplanan KDV kapanışı'));
      if(o.indirilecek>0.005) har.push(this.har(islem, o.id191, 0, o.indirilecek, 'İndirilecek KDV kapanışı'));
      if(o.fark>0.005) har.push(this.har(islem, Hesap.sistemId('360'), 0, o.fark, 'Ödenecek KDV'));
      else if(o.fark<-0.005) har.push(this.har(islem, Hesap.sistemId('190'), -o.fark, 0, 'Devreden KDV'));
      Depo.veri.islemler.push(islem);
      Depo.veri.hareketler.push(...har);
      Depo.kaydet();
      Bildirim.goster('basari','Oluşturuldu','KDV mahsup fişi ('+islem.no+') oluşturuldu.');
      App.sayfaGit('donem');
    }, 'Evet, Oluştur');
  },

  /* ---- KÂR / ZARAR KAPANIŞI ---- */
  karZararOzet(tarih){
    let gelir=0, gider=0;
    const gelirler=[], giderler=[];
    Depo.veri.altHesaplar.filter(h=>h.anaKod==='600').forEach(h=>{
      const b = -this.tarihliBakiye(h.id, tarih); // alacak nitelikli
      if(Math.abs(b)>0.005){ gelir+=b; gelirler.push({id:h.id, tutar:b}); }
    });
    Depo.veri.altHesaplar.filter(h=>h.anaKod==='770').forEach(h=>{
      const b = this.tarihliBakiye(h.id, tarih); // borç nitelikli
      if(Math.abs(b)>0.005){ gider+=b; giderler.push({id:h.id, tutar:b}); }
    });
    const sonuc = gelir - gider; // + kâr, - zarar
    return { gelir, gider, sonuc, gelirler, giderler };
  },

  karZararHesaplaGoster(){
    const tarih = document.getElementById('kz-tarih').value;
    if(!tarih){ Bildirim.goster('hata','Eksik Tarih','Dönem sonu tarihi seçin.'); return; }
    const o = this.karZararOzet(tarih);
    const sonuc = o.sonuc>0.005 ? `<b style="color:var(--yesil)">DÖNEM KÂRI: ${Yardimci.paraFormat(o.sonuc)}</b>`
                : o.sonuc<-0.005 ? `<b style="color:var(--kirmizi)">DÖNEM ZARARI: ${Yardimci.paraFormat(-o.sonuc)}</b>`
                : `<b>Sonuç: 0,00 TL</b>`;
    document.getElementById('kz-sonuc').innerHTML = `
      <div class="etiket-satir"><span>Toplam Gelir (600)</span><b>${Yardimci.paraFormat(o.gelir)}</b></div>
      <div class="etiket-satir"><span>Toplam Gider (770)</span><b>${Yardimci.paraFormat(o.gider)}</b></div>
      <div class="etiket-satir"><span>Sonuç</span>${sonuc}</div>`;
  },

  karZararKapat(){
    const tarih = document.getElementById('kz-tarih').value;
    if(!tarih){ Bildirim.goster('hata','Eksik Tarih','Dönem sonu tarihi seçin.'); return; }
    const donemAd = document.getElementById('kz-donem').value.trim();
    const o = this.karZararOzet(tarih);
    if(o.gelirler.length===0 && o.giderler.length===0){
      Bildirim.goster('uyari','Kayıt Yok','Kapatılacak gelir/gider bulunmuyor.'); return;
    }
    Modal.onay('Dönem Kapanış Fişi','600 ve 770 hesapları kapatılıp 690 üzerinden 590/591 hesabına kâr/zarar aktarılacak. Onaylıyor musunuz?', ()=>{
      const id690 = Hesap.sistemId('690');
      const islem = { id:Yardimci.yeniId(), no:Depo.yeniIslemNo(), tur:'kapanis', tarih:tarih,
        hesapId:id690, islemAd:'Dönem Kapanışı'+(donemAd?' ('+donemAd+')':''), donemAd:donemAd, tutar:o.sonuc };
      const har = [];
      // Gelirleri kapat: 600 Borç, 690 Alacak
      o.gelirler.forEach(g=>{ har.push(this.har(islem, g.id, g.tutar, 0, 'Gelir kapanışı')); har.push(this.har(islem, id690, 0, g.tutar, 'Gelir devri (690)')); });
      // Giderleri kapat: 770 Alacak, 690 Borç
      o.giderler.forEach(g=>{ har.push(this.har(islem, g.id, 0, g.tutar, 'Gider kapanışı')); har.push(this.har(islem, id690, g.tutar, 0, 'Gider devri (690)')); });
      // 690 -> 590 (kâr) / 591 (zarar)
      if(o.sonuc>0.005){ har.push(this.har(islem, id690, o.sonuc, 0, '690 kapanışı')); har.push(this.har(islem, Hesap.sistemId('590'), 0, o.sonuc, 'Dönem Net Kârı')); }
      else if(o.sonuc<-0.005){ har.push(this.har(islem, id690, 0, -o.sonuc, '690 kapanışı')); har.push(this.har(islem, Hesap.sistemId('591'), -o.sonuc, 0, 'Dönem Net Zararı')); }
      Depo.veri.islemler.push(islem);
      Depo.veri.hareketler.push(...har);
      Depo.kaydet();
      Bildirim.goster('basari','Oluşturuldu','Dönem kapanış fişi ('+islem.no+') oluşturuldu.');
      App.sayfaGit('donem');
    }, 'Evet, Oluştur');
  },

  /* ---- FİŞ LİSTESİ ---- */
  fisListesi(){
    const el = document.getElementById('donem-fisler');
    if(!el) return;
    const fisler = Depo.veri.islemler.filter(x=>x.tur==='kdvmahsup'||x.tur==='kapanis')
      .sort((a,b)=>(b.no||'').localeCompare(a.no||''));
    if(fisler.length===0){ el.innerHTML = `<div class="bos-mesaj">Henüz dönem fişi oluşturulmadı.</div>`; return; }
    el.innerHTML = `<div class="tablo-sar"><table class="veri"><thead><tr>
      <th>Fiş No</th><th>Tarih</th><th>Tür</th><th>Açıklama</th><th class="sag-hiza">Sonuç</th><th class="no-print">İşlem</th></tr></thead><tbody>
      ${fisler.map(f=>`<tr>
        <td><span class="kod-rozet">${f.no}</span></td>
        <td>${Yardimci.tarihFormat(f.tarih)}</td>
        <td>${f.tur==='kdvmahsup'?'KDV Mahsubu':'Dönem Kapanışı'}</td>
        <td>${Yardimci.kacisHTML(f.islemAd||'')}</td>
        <td class="sag-hiza">${Yardimci.paraFormat(f.tutar)}</td>
        <td class="no-print"><button class="btn btn-cizgi btn-kucuk" onclick="Donem.fisSil('${f.id}')">🗑 Sil</button></td>
      </tr>`).join('')}
    </tbody></table></div>`;
  },

  fisSil(id){
    Modal.onay('Fiş Sil','Bu dönem fişini silmek istediğinize emin misiniz? İlgili kapanış hareketleri geri alınacaktır.', ()=>{
      Depo.veri.islemler = Depo.veri.islemler.filter(x=>x.id!==id);
      Depo.veri.hareketler = Depo.veri.hareketler.filter(h=>h.islemId!==id);
      Depo.kaydet();
      Bildirim.goster('basari','Silindi','Dönem fişi silindi, hareketler geri alındı.');
      App.sayfaGit('donem');
    }, 'Evet, Sil', true);
  }
};

/* ==================================================================
   Bölüm 14c: Kredi Kartı Taksit Sistemi
   ================================================================== */
const Taksit = {
  YAKLASAN_GUN:7,
  // Taksitleri hesapla; kuruş farkı son taksite eklenir
  hesapla(toplam, adet, ilkTarih){
    adet = Math.max(1, adet|0);
    const per = Math.floor((toplam/adet)*100)/100;
    const hedefGun = ilkTarih ? Yardimci.parcala(ilkTarih).d : undefined;
    const arr = [];
    for(let i=0;i<adet;i++){
      const tutar = (i===adet-1) ? Math.round((toplam - per*(adet-1))*100)/100 : per;
      const tarih = ilkTarih ? Yardimci.ayEkle(ilkTarih, i, hedefGun) : '';
      arr.push({no:i+1, tutar, tarih});
    }
    return arr;
  },
  // İşlem için taksit planı üret (gerçekleşmiş taksitleri korur)
  olustur(islem){
    const mevcut = Depo.veri.taksitler.filter(t=>t.islemId===islem.id);
    const korunan = mevcut.filter(t=> t.durum==='gerceklesti' || t.bankaHareketId);
    Depo.veri.taksitler = Depo.veri.taksitler.filter(t=>t.islemId!==islem.id);
    Depo.veri.taksitPlanlari = Depo.veri.taksitPlanlari.filter(p=>p.islemId!==islem.id);
    const adet = Math.max(1, islem.taksitSayisi||1);
    const plan = { id:Yardimci.yeniId(), islemId:islem.id, hesapId:islem.hesapId,
      toplamTutar:islem.tutar, taksitSayisi:adet, kartOdemeGunu:islem.kartOdemeGunu, ilkTaksitTarihi:islem.ilkTaksitTarihi };
    Depo.veri.taksitPlanlari.push(plan);
    const sched = this.hesapla(islem.tutar, adet, islem.ilkTaksitTarihi);
    sched.forEach(s=>{
      const kept = korunan.find(k=>k.taksitNo===s.no);
      if(kept){ kept.planId=plan.id; Depo.veri.taksitler.push(kept); }
      else Depo.veri.taksitler.push({ id:Yardimci.yeniId(), planId:plan.id, islemId:islem.id, hesapId:islem.hesapId,
        taksitNo:s.no, tutar:s.tutar, planlananTarih:s.tarih, durum:'bekliyor', gerceklesenTarih:null, bankaHareketId:null, aciklama:islem.islemAd });
    });
  },
  byIslem(islemId){ return Depo.veri.taksitler.filter(t=>t.islemId===islemId).sort((a,b)=>a.taksitNo-b.taksitNo); },
  bul(id){ return Depo.veri.taksitler.find(t=>t.id===id); },
  // Dinamik durum
  durum(t){
    if(t.durum==='iptal') return {key:'iptal', ad:'İptal Edildi', renk:'var(--metin-soluk)'};
    if(t.durum==='gerceklesti' || t.bankaHareketId) return {key:'gerceklesti', ad:'Gerçekleşti', renk:'var(--yesil)'};
    const bugun = Yardimci.bugun();
    if(t.planlananTarih && t.planlananTarih < bugun) return {key:'gecikti', ad:'Gecikti', renk:'var(--kirmizi)'};
    const fark = t.planlananTarih ? Yardimci.gunFark(bugun, t.planlananTarih) : 999;
    if(fark>=0 && fark<=this.YAKLASAN_GUN) return {key:'yaklasiyor', ad:'Yaklaşıyor', renk:'var(--sari)'};
    return {key:'bekliyor', ad:'Bekliyor', renk:'var(--metin-soluk)'};
  },
  rozet(t){ const d=this.durum(t); return `<span class="rozet" style="background:${d.renk}22;color:${d.renk}">${d.ad}</span>`; },

  planModal(islemId){
    const is = Depo.veri.islemler.find(x=>x.id===islemId);
    if(!is){ return; }
    const taksitler = this.byIslem(islemId);
    const kart = Hesap.altBul(is.hesapId);
    let govde = `<div class="etiket-satir"><span>İşlem</span><b>${Yardimci.kacisHTML(is.islemAd)} — ${is.no}</b></div>
      <div class="etiket-satir"><span>Kart</span><b>${kart?Yardimci.kacisHTML(kart.kod+' '+Hesap.hesapAdi(kart)):'-'}</b></div>
      <div class="etiket-satir"><span>Toplam / Taksit</span><b>${Yardimci.paraFormat(is.tutar)} / ${is.taksitSayisi} taksit</b></div>`;
    if(taksitler.length===0){ govde += `<div class="bos-mesaj">Bu işleme ait taksit bulunmuyor.</div>`; }
    else{
      govde += `<div class="tablo-sar" style="margin-top:12px"><table class="veri"><thead><tr>
        <th>Taksit</th><th>Planlanan</th><th class="sag-hiza">Tutar</th><th>Durum</th><th>Gerçekleşen</th><th>Banka</th><th class="no-print">İşlemler</th>
      </tr></thead><tbody>${taksitler.map(t=>{
        const h = t.bankaHareketId ? Depo.veri.hareketler.find(x=>x.id===t.bankaHareketId) : null;
        const bankaH = h ? (Hesap.altBul(h.hesapId)||{}) : null;
        return `<tr>
          <td>${t.taksitNo}. Taksit</td>
          <td>${Yardimci.tarihFormat(t.planlananTarih)}</td>
          <td class="sag-hiza">${Yardimci.paraFormat(t.tutar)}</td>
          <td>${this.rozet(t)}</td>
          <td>${t.gerceklesenTarih?Yardimci.tarihFormat(t.gerceklesenTarih):'-'}</td>
          <td>${bankaH?Yardimci.kacisHTML(Hesap.hesapAdi(bankaH)):'-'}</td>
          <td class="no-print satir-ic">
            <button class="btn btn-cizgi btn-kucuk" title="Gerçekleşti" onclick="Taksit.gerceklesti('${t.id}','${islemId}')">✓</button>
            <button class="btn btn-cizgi btn-kucuk" title="Tarih" onclick="Taksit.tarihDegistir('${t.id}','${islemId}')">📅</button>
            <button class="btn btn-cizgi btn-kucuk" title="Tutar" onclick="Taksit.tutarDuzenle('${t.id}','${islemId}')">₺</button>
            <button class="btn btn-cizgi btn-kucuk" title="Banka Eşleştir" onclick="Taksit.eslestirModal('${t.id}','${islemId}')">🔗</button>
            <button class="btn btn-cizgi btn-kucuk" title="İptal" onclick="Taksit.iptal('${t.id}','${islemId}')">✕</button>
          </td></tr>`;
      }).join('')}</tbody></table></div>`;
    }

  // Bir kuralın [bas,bit] aralığındaki tarihlerini üret
  tarihler(o, bas, bit){
    if(o.aktif===false) return [];
    const sonuc = [];
    const kbas = o.baslangic && o.baslangic>bas ? o.baslangic : bas;
    const kbit = o.bitis && o.bitis<bit ? o.bitis : bit;
    if(kbas>kbit) return [];
    if(o.tekrar==='tek'){
      if(o.nettarih && o.nettarih>=bas && o.nettarih<=bit) sonuc.push(o.nettarih);
    }else if(o.tekrar==='haftalik'){
      let g = kbas;
      // ilk hedef güne ilerle
      let guard=0;
      while(Yardimci.haftaGunu(g)!==(o.haftaGunu||0) && guard<7){ g=Yardimci.gunEkle(g,1); guard++; }
      while(g<=kbit){ sonuc.push(g); g=Yardimci.gunEkle(g,7); }
    }else if(o.tekrar==='aylik'){
      const p = Yardimci.parcala(kbas);
      let y=p.y, m=p.m;
      while(true){
        const son=Yardimci.ayinSonGunu(y,m);
        const t=Yardimci.iso(y,m,Math.min(o.gun||1, son));
        if(t>kbit) break;
        if(t>=kbas) sonuc.push(t);
        m++; if(m>12){m=1;y++;}
        if((y-p.y)>5) break;
      }
    }else if(o.tekrar==='yillik'){
      let y=Yardimci.parcala(kbas).y;
      while(true){
        const son=Yardimci.ayinSonGunu(y,o.ay||1);
        const t=Yardimci.iso(y,o.ay||1,Math.min(o.gun||1,son));
        if(t>kbit) break;
        if(t>=kbas) sonuc.push(t);
        y++;
        if(y>Yardimci.parcala(kbit).y) break;
      }
    }
    return sonuc;
  },
  // Override (istisna) bul
  override(kuralId, tarih){ return Depo.veri.ongoruGercek.find(x=>x.kuralId===kuralId && x.tarih===tarih); },
  // [bas,bit] aralığındaki tüm gerçekleşme kayıtları (override uygulanmış)
  gerceklesmeler(bas, bit){
    const out = [];
    Depo.veri.ongoruler.forEach(o=>{
      this.tarihler(o, bas, bit).forEach(t=>{
        const ov = this.override(o.id, t);
        out.push({
          kuralId:o.id, tur:o.tur, aciklama:o.aciklama, grupId:o.grupId, bankaHesapId:o.bankaHesapId,
          tarih:t, tutar: ov && ov.gercekTutar!=null ? ov.gercekTutar : o.tutar,
          iptal: ov && (ov.durum==='iptal'||ov.durum==='atlandi'),
          matched: !!(ov && ov.bankaHareketId),
          gerceklesti: !!(ov && ov.durum==='gerceklesti')
        });
      });
    });
    return out;
  }
};

/* ==================================================================
   Bölüm 14f: Nakit Akışı
   ================================================================== */
const NakitAkis = {
  _pop:null,
  aralikGun:{ '1ay':30, '3ay':90, '6ay':180, '1yil':365 },

  filtreliBankalar(){
    const secili = Depo.veri.nakitAyar.bankaFiltre || [];
    const hepsi = Depo.veri.altHesaplar.filter(h=>h.anaKod==='102').map(h=>h.id);
    if(!secili.length) return hepsi;
    return hepsi.filter(id=>secili.includes(id));
  },
  aralik(){
    const ayar = Depo.veri.nakitAyar;
    const bugun = Yardimci.bugun();
    if(ayar.aralik==='ozel' && ayar.ozelBas && ayar.ozelBit) return [ayar.ozelBas, ayar.ozelBit];
    const g = this.aralikGun[ayar.aralik]||30;
    return [bugun, Yardimci.gunEkle(bugun, g)];
  },
  // Ana hesaplama: [bas,bit] arası günlük seri
  projeksiyon(bas, bit, gorunum, bankaIds, kartDahil){
    const oncekiGun = Yardimci.gunEkle(bas,-1);
    let devir = 0;
    bankaIds.forEach(id=>{ devir += Donem.tarihliBakiye(id, oncekiGun); });
    const gunler = []; let g=bas;
    while(g<=bit){ gunler.push(g); g=Yardimci.gunEkle(g,1); if(gunler.length>1200) break; }
    const map = {}; gunler.forEach(t=> map[t]={giris:[],cikis:[]});
    const realDahil = gorunum!=='tahmini';
    const tahminDahil = gorunum!=='gerceklesen';
    const bankaAd = (id)=>{ const h=Hesap.altBul(id); return h?Hesap.hesapAdi(h):''; };
    // 1) gerçekleşen banka hareketleri
    if(realDahil){
      Depo.veri.hareketler.forEach(h=>{
        if(!bankaIds.includes(h.hesapId)) return;
        if(h.tarih<bas||h.tarih>bit) return;
        const is = Depo.veri.islemler.find(x=>x.id===h.islemId)||{};
        if(h.borc>0) map[h.tarih].giris.push({ad:is.islemAd||h.aciklama||'Banka Girişi', hesap:bankaAd(h.hesapId), grup:'', tutar:h.borc, durum:'Gerçekleşen', tip:'gercek'});
        if(h.alacak>0) map[h.tarih].cikis.push({ad:is.islemAd||h.aciklama||'Banka Çıkışı', hesap:bankaAd(h.hesapId), grup:'', tutar:h.alacak, durum:'Gerçekleşen', tip:'gercek'});
      });
    }
    // 2) kredi kartı taksitleri (tahmini çıkış)
    if(tahminDahil && kartDahil){
      Depo.veri.taksitler.forEach(t=>{
        if(t.durum==='iptal' || t.bankaHareketId || t.durum==='gerceklesti') return;
        if(!t.planlananTarih || t.planlananTarih<bas || t.planlananTarih>bit) return;
        const is = Depo.veri.islemler.find(x=>x.id===t.islemId)||{};
        const kart = Hesap.altBul(t.hesapId);
        map[t.planlananTarih].cikis.push({ad:(is.islemAd||'Kart')+' — '+t.taksitNo+'. Taksit', hesap:kart?Hesap.hesapAdi(kart):'', grup:is.giderHesapId?Hesap.hesapAdi(Hesap.altBul(is.giderHesapId)||{}):'', tutar:t.tutar, durum:'Tahmini', tip:'tahmini'});
      });
    }
    // 3) öngörülen ödeme/gelirler (tahmini)
    if(tahminDahil){
      Ongoru.gerceklesmeler(bas, bit).forEach(o=>{
        if(o.iptal || o.matched) return;
        const dizi = o.tur==='gelir' ? 'giris' : 'cikis';
        const hedef = map[o.tarih]; if(!hedef) return;
        hedef[dizi].push({ad:o.aciklama, hesap:o.bankaHesapId?bankaAd(o.bankaHesapId):'', grup:Gruplar.ad(o.grupId), tutar:o.tutar, durum:'Tahmini', tip:'tahmini'});
      });
    }
    const seri = []; let yuruyen = devir;
    gunler.forEach(t=>{
      const gi = map[t].giris.reduce((s,x)=>s+x.tutar,0);
      const ci = map[t].cikis.reduce((s,x)=>s+x.tutar,0);
      const bdevir = yuruyen; const kalan = bdevir+gi-ci; yuruyen=kalan;
      seri.push({tarih:t, devir:bdevir, giris:gi, cikis:ci, kalan, gd:map[t].giris, cd:map[t].cikis});
    });
    return {seri, devir};
  },

  sayfa(el){
    const ayar = Depo.veri.nakitAyar;
    const bankalar = Depo.veri.altHesaplar.filter(h=>h.anaKod==='102');
    el.innerHTML = `
      <div class="nakit-ozet" id="nakit-ozet"></div>
      <div id="nakit-uyari"></div>
      <div class="kart">
        <div class="nakit-arac no-print">
          <label>Aralık:</label>
          <select id="nk-aralik" onchange="NakitAkis.aralikDegis()">
            <option value="1ay" ${ayar.aralik==='1ay'?'selected':''}>1 Ay</option>
            <option value="3ay" ${ayar.aralik==='3ay'?'selected':''}>3 Ay</option>
            <option value="6ay" ${ayar.aralik==='6ay'?'selected':''}>6 Ay</option>
            <option value="1yil" ${ayar.aralik==='1yil'?'selected':''}>1 Yıl</option>
            <option value="ozel" ${ayar.aralik==='ozel'?'selected':''}>Özel Tarih</option>
          </select>
          <span id="nk-ozel-alan" style="display:${ayar.aralik==='ozel'?'inline-flex':'none'};gap:6px">
            <input type="date" id="nk-ozelbas" value="${ayar.ozelBas||Yardimci.bugun()}">
            <input type="date" id="nk-ozelbit" value="${ayar.ozelBit||''}"></span>
          <label>Görünüm:</label>
          <select id="nk-gorunum" onchange="NakitAkis.gorunumDegis()">
            <option value="tahmin" ${ayar.gorunum==='tahmin'?'selected':''}>Tahmin Dahil</option>
            <option value="gerceklesen" ${ayar.gorunum==='gerceklesen'?'selected':''}>Gerçekleşenler</option>
            <option value="tahmini" ${ayar.gorunum==='tahmini'?'selected':''}>Sadece Tahmini</option>
          </select>
          <label>Banka:</label>
          <select id="nk-banka" multiple size="3" style="min-width:150px" onchange="NakitAkis.bankaDegis()">
            ${bankalar.map(h=>`<option value="${h.id}" ${(ayar.bankaFiltre||[]).includes(h.id)?'selected':''}>${Yardimci.kacisHTML(Hesap.hesapAdi(h))}</option>`).join('')}
          </select>
          <label style="display:inline-flex;align-items:center;gap:5px"><input type="checkbox" id="nk-kart" ${ayar.kartDahil!==false?'checked':''} onchange="NakitAkis.kartDegis()"> Kart Taksitleri</label>
          <button class="btn btn-koyu btn-kucuk" onclick="Ongoru.formModal()">＋ Öngörü Ekle</button>
          <button class="btn btn-yesil btn-kucuk" onclick="NakitAkis.csvOzet()">📊 CSV Özet</button>
          <button class="btn btn-yesil btn-kucuk" onclick="NakitAkis.csvDetay()">📊 CSV Detay</button>
        </div>
        <div class="nakit-tablo-sar" id="nakit-tablo"></div>
        <div class="nakit-grafik-kutu no-print">
          <canvas id="nk-grafik-kalan" width="600" height="220"></canvas>
          <canvas id="nk-grafik-gc" width="600" height="220"></canvas>
        </div>
      </div>`;
    if(bankalar.length===0){
      document.getElementById('nakit-tablo').innerHTML = `<div class="bos-mesaj">Henüz banka hesabı yok. Hesaplar sayfasından 102 Bankalar altında hesap açın.</div>`;
    }
    this.ciz();
  },

  ciz(){
    const ayar = Depo.veri.nakitAyar;
    const [bas,bit] = this.aralik();
    const bankaIds = this.filtreliBankalar();
    const kartDahil = ayar.kartDahil!==false;
    if(bankaIds.length===0){ this.ozetKartlar(null); return; }
    const {seri} = this.projeksiyon(bas, bit, ayar.gorunum, bankaIds, kartDahil);
    this._seri = seri;
    this.tabloCiz(seri);
    this.ozetKartlar(seri);
    this.grafikKalan(seri);
    this.grafikGC(seri);
  },

  tabloCiz(seri){
    const el = document.getElementById('nakit-tablo'); if(!el) return;
    if(seri.length===0){ el.innerHTML = `<div class="bos-mesaj">Seçilen aralıkta veri yok.</div>`; return; }
    const bugun = Yardimci.bugun();
    const dusuk = Number(Depo.veri.nakitAyar.dusukBakiye)||0;
    const bas = (etiket, cls)=>`<td class="sabit ${cls}">${etiket}</td>`;
    let thead = `<tr><th class="sabit">Nakit Akışı</th>` + seri.map(s=>`<th class="${s.tarih===bugun?'bugun-sutun':''}">${Yardimci.tarihFormat(s.tarih)}<br><span style="font-weight:400;font-size:11px;opacity:.8">${Yardimci.tarihGunAdi(s.tarih)}</span></th>`).join('') + `</tr>`;
    const rowDevir = `<tr class="satir-devir">`+bas('Banka Devir')+seri.map(s=>`<td>${Yardimci.paraFormat(s.devir)}</td>`).join('')+`</tr>`;
    const rowGiris = `<tr class="satir-giris">`+bas('Banka Giriş')+seri.map((s,i)=>`<td class="deger nakit-hucre ${s.tarih===bugun?'bugun-sutun':''}" data-t="giris" data-i="${i}" onmouseenter="NakitAkis.pop(event,${i},'giris')" onmouseleave="NakitAkis.popKapat()" onclick="NakitAkis.pop(event,${i},'giris')">${s.giris?Yardimci.paraFormat(s.giris):'-'}</td>`).join('')+`</tr>`;
    const rowCikis = `<tr class="satir-cikis">`+bas('Banka Çıkış')+seri.map((s,i)=>`<td class="deger nakit-hucre ${s.tarih===bugun?'bugun-sutun':''}" data-t="cikis" data-i="${i}" onmouseenter="NakitAkis.pop(event,${i},'cikis')" onmouseleave="NakitAkis.popKapat()" onclick="NakitAkis.pop(event,${i},'cikis')">${s.cikis?Yardimci.paraFormat(s.cikis):'-'}</td>`).join('')+`</tr>`;
    const rowKalan = `<tr class="satir-kalan">`+bas('Banka Kalan')+seri.map(s=>{
      let cls=''; if(s.kalan<0) cls='neg'; else if(dusuk>0 && s.kalan<dusuk) cls='dusuk';
      const uyari = s.kalan<0?'⚠ ':'';
      return `<td class="${cls} ${s.tarih===bugun?'bugun-sutun':''}">${uyari}${Yardimci.paraFormat(s.kalan)}</td>`;
    }).join('')+`</tr>`;
    el.innerHTML = `<table class="nakit"><thead>${thead}</thead><tbody>${rowDevir}${rowGiris}${rowCikis}${rowKalan}</tbody></table>`;
  },

  pop(ev, i, tur){
    const s = this._seri && this._seri[i]; if(!s) return;
    const detay = tur==='giris'?s.gd:s.cd;
    if(!detay || detay.length===0) return;
    let box = document.getElementById('nakit-pop');
    if(!box){ box=document.createElement('div'); box.id='nakit-pop'; box.className='nakit-pop'; document.body.appendChild(box); }
    const toplam = detay.reduce((a,x)=>a+x.tutar,0);
    box.innerHTML = `<h4>${Yardimci.tarihFormat(s.tarih)} — ${tur==='giris'?'Banka Giriş':'Banka Çıkış'}</h4>`+
      detay.map(d=>`<div class="pop-satir"><div><div>${Yardimci.kacisHTML(d.ad)}</div>
        <div class="pop-aciklama">${[d.hesap,d.grup].filter(Boolean).map(Yardimci.kacisHTML).join(' • ')} ${d.tip==='tahmini'?'<span class="nk-tahmini">Tahmini</span>':'<span style="color:var(--yesil)">● Gerçekleşen</span>'}</div></div>
        <div style="font-weight:600;white-space:nowrap">${Yardimci.paraFormat(d.tutar)}</div></div>`).join('')+
      `<div class="pop-toplam"><span>Toplam</span><span>${Yardimci.paraFormat(toplam)}</span></div>`;
    box.classList.add('acik');
    // konumlandır (ekran dışına taşmasın)
    const r = ev.target.getBoundingClientRect();
    box.style.visibility='hidden';
    const bw = box.offsetWidth, bh = box.offsetHeight;
    let x = r.left, y = r.bottom+6;
    if(x+bw > window.innerWidth-10) x = window.innerWidth-bw-10;
    if(x<10) x=10;
    if(y+bh > window.innerHeight-10) y = r.top-bh-6;
    box.style.left=x+'px'; box.style.top=Math.max(10,y)+'px'; box.style.visibility='visible';
  },
  popKapat(){ const b=document.getElementById('nakit-pop'); if(b) b.classList.remove('acik'); },

  ozetKartlar(seri){
    const el = document.getElementById('nakit-ozet'); const uy = document.getElementById('nakit-uyari');
    if(!el) return;
    const bankaIds = this.filtreliBankalar();
    const bugun = Yardimci.bugun();
    let bugunBakiye=0; bankaIds.forEach(id=>{ bugunBakiye += Donem.tarihliBakiye(id, bugun); });
    // 1 yıllık projeksiyon (özet için, tahmin dahil)
    const {seri:yil} = this.projeksiyon(bugun, Yardimci.gunEkle(bugun,365), 'tahmin', bankaIds, Depo.veri.nakitAyar.kartDahil!==false);
    const bakiyeGun=(n)=>{ const t=Yardimci.gunEkle(bugun,n); const s=yil.find(x=>x.tarih===t); return s?s.kalan:(yil.length?yil[yil.length-1].kalan:bugunBakiye); };
    let toplamGelir=0, toplamOdeme=0, enDusuk=Infinity, enDusukT='', ilkAcik=null;
    yil.forEach(s=>{ toplamGelir+=s.giris; toplamOdeme+=s.cikis; if(s.kalan<enDusuk){enDusuk=s.kalan;enDusukT=s.tarih;} if(ilkAcik===null && s.kalan<0) ilkAcik=s; });
    const kart=(ik,et,dg,renk)=>`<div class="ozet-kart"><div class="ust"><div class="ozet-ikon ${renk}">${ik}</div><div class="etiket">${et}</div></div><div class="deger">${dg}</div></div>`;
    el.innerHTML =
      kart('🏦','i-mavi','Bugünkü Banka Bakiyesi',Yardimci.paraFormat(bugunBakiye))+
      kart('📅','i-mavi','30 Gün Sonra',Yardimci.paraFormat(bakiyeGun(30)))+
      kart('📅','i-mavi','90 Gün Sonra',Yardimci.paraFormat(bakiyeGun(90)))+
      kart('📅','i-mavi','1 Yıl Sonra',Yardimci.paraFormat(bakiyeGun(365)))+
      kart('📥','i-yesil','Toplam Beklenen Gelir',Yardimci.paraFormat(toplamGelir))+
      kart('📤','i-kirmizi','Toplam Beklenen Ödeme',Yardimci.paraFormat(toplamOdeme))+
      kart('📉','i-turuncu','En Düşük Tahmini Bakiye',Yardimci.paraFormat(enDusuk===Infinity?bugunBakiye:enDusuk))+
      kart('⚠️','i-kirmizi','İlk Nakit Açığı',ilkAcik?Yardimci.tarihFormat(ilkAcik.tarih):'Yok');
    if(uy){
      if(ilkAcik){
        const gunSayisi = yil.filter(s=>s.kalan<0).length;
        uy.innerHTML = `<div class="uyari-serit">⚠ ${Yardimci.tarihFormat(ilkAcik.tarih)} tarihinde tahmini banka bakiyesi ${Yardimci.paraFormat(ilkAcik.kalan)} olacaktır. Negatif bakiye tahmini olarak ${gunSayisi} gün sürebilir. En düşük bakiye: ${Yardimci.paraFormat(enDusuk)} (${Yardimci.tarihFormat(enDusukT)}).</div>`;
      }else uy.innerHTML='';
    }
  },

  // --- Basit Canvas grafikler ---
  grafikKalan(seri){
    const c=document.getElementById('nk-grafik-kalan'); if(!c) return;
    const ctx=c.getContext('2d'); const W=c.width, H=c.height; ctx.clearRect(0,0,W,H);
    const koyu = document.body.classList.contains('tema-koyu');
    const metin = koyu?'#e8ebf0':'#1f2530';
    ctx.fillStyle=metin; ctx.font='12px Segoe UI'; ctx.fillText('Günlük Banka Kalan', 10, 18);
    if(seri.length<2) return;
    const vals=seri.map(s=>s.kalan); let mn=Math.min(0,...vals), mx=Math.max(...vals); if(mx===mn) mx=mn+1;
    const padL=54, padR=12, padT=28, padB=20; const gw=W-padL-padR, gh=H-padT-padB;
    const x=i=> padL + gw*i/(seri.length-1);
    const y=v=> padT + gh*(1-(v-mn)/(mx-mn));
    // sıfır çizgisi
    ctx.strokeStyle=koyu?'#3a4552':'#e2e6ec'; ctx.beginPath(); ctx.moveTo(padL,y(0)); ctx.lineTo(W-padR,y(0)); ctx.stroke();
    ctx.fillStyle=koyu?'#9aa4b2':'#5b6472'; ctx.font='10px Segoe UI';
    ctx.fillText(Yardimci.sayiFormat(mx), 4, y(mx)+4); ctx.fillText(Yardimci.sayiFormat(mn), 4, y(mn)+4);
    // alan
    ctx.beginPath(); ctx.moveTo(x(0),y(vals[0]));
    for(let i=1;i<seri.length;i++) ctx.lineTo(x(i),y(vals[i]));
    ctx.strokeStyle='#d32027'; ctx.lineWidth=2; ctx.stroke();
    // negatif noktalar
    seri.forEach((s,i)=>{ if(s.kalan<0){ ctx.fillStyle='#d32027'; ctx.beginPath(); ctx.arc(x(i),y(s.kalan),2.5,0,7); ctx.fill(); } });
  },
  grafikGC(seri){
    const c=document.getElementById('nk-grafik-gc'); if(!c) return;
    const ctx=c.getContext('2d'); const W=c.width,H=c.height; ctx.clearRect(0,0,W,H);
    const koyu=document.body.classList.contains('tema-koyu'); const metin=koyu?'#e8ebf0':'#1f2530';
    ctx.fillStyle=metin; ctx.font='12px Segoe UI'; ctx.fillText('Günlük Giriş / Çıkış', 10, 18);
    if(seri.length===0) return;
    const mx=Math.max(1,...seri.map(s=>Math.max(s.giris,s.cikis)));
    const padL=10,padR=10,padT=28,padB=14; const gw=W-padL-padR, gh=H-padT-padB;
    const n=seri.length; const bw=Math.max(1, gw/n/2 - 0.5);
    seri.forEach((s,i)=>{
      const cx=padL + gw*i/n;
      const gh1=gh*s.giris/mx, gh2=gh*s.cikis/mx;
      ctx.fillStyle='#1f9d55'; ctx.fillRect(cx, padT+gh-gh1, bw, gh1);
      ctx.fillStyle='#d32027'; ctx.fillRect(cx+bw+0.5, padT+gh-gh2, bw, gh2);
    });
  },

  // --- Toolbar olayları ---
  aralikDegis(){ const v=document.getElementById('nk-aralik').value; Depo.veri.nakitAyar.aralik=v;
    document.getElementById('nk-ozel-alan').style.display = v==='ozel'?'inline-flex':'none';
    if(v==='ozel'){ Depo.veri.nakitAyar.ozelBas=document.getElementById('nk-ozelbas').value; Depo.veri.nakitAyar.ozelBit=document.getElementById('nk-ozelbit').value; }
    Depo.kaydet(); this.ciz(); },
  gorunumDegis(){ Depo.veri.nakitAyar.gorunum=document.getElementById('nk-gorunum').value; Depo.kaydet(); this.ciz(); },
  bankaDegis(){ const sel=document.getElementById('nk-banka'); Depo.veri.nakitAyar.bankaFiltre=[...sel.selectedOptions].map(o=>o.value); Depo.kaydet(); this.ciz(); },
  kartDegis(){ Depo.veri.nakitAyar.kartDahil=document.getElementById('nk-kart').checked; Depo.kaydet(); this.ciz(); },

  // --- CSV ---
  csvOzet(){
    if(!this._seri){ Bildirim.goster('uyari','Veri Yok','Önce rapor oluşturun.'); return; }
    const bas=['Satır', ...this._seri.map(s=>Yardimci.tarihFormat(s.tarih))];
    const r=(et,f)=>[et, ...this._seri.map(s=>Yardimci.sayiFormat(f(s)))];
    Disari.csv(bas, [r('Banka Devir',s=>s.devir), r('Banka Giriş',s=>s.giris), r('Banka Çıkış',s=>s.cikis), r('Banka Kalan',s=>s.kalan)], 'nakit-akisi-ozet');
  },
  csvDetay(){
    if(!this._seri){ Bildirim.goster('uyari','Veri Yok','Önce rapor oluşturun.'); return; }
    const bas=['Tarih','Tür','Açıklama','Hesap/Kart','Grup','Tahmini Tutar','Gerçekleşen Tutar','Durum'];
    const satir=[];
    this._seri.forEach(s=>{
      s.gd.forEach(d=>satir.push([Yardimci.tarihFormat(s.tarih),'Giriş',d.ad,d.hesap,d.grup, d.tip==='tahmini'?Yardimci.sayiFormat(d.tutar):'', d.tip==='gercek'?Yardimci.sayiFormat(d.tutar):'', d.durum]));
      s.cd.forEach(d=>satir.push([Yardimci.tarihFormat(s.tarih),'Çıkış',d.ad,d.hesap,d.grup, d.tip==='tahmini'?Yardimci.sayiFormat(d.tutar):'', d.tip==='gercek'?Yardimci.sayiFormat(d.tutar):'', d.durum]));
    });
    if(satir.length===0){ Bildirim.goster('uyari','Detay Yok','Aktarılacak hareket yok.'); return; }
    Disari.csv(bas, satir, 'nakit-akisi-detay');
  }
};

    if(e.target.id==='modal-katman') Modal.kapat();

  // ESC ile modal kapat
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') Modal.kapat(); });
});
